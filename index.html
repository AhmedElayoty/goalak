<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Goalak · الجول جولك</title>
<meta name="description" content="Goalak · الجول جولك · live scores, fixtures, tables and stats for the top football leagues">
<meta name="theme-color" content="#0a1230">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goalak">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Alexandria:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
 /* WCup family palette (same navy/rust/gold as the World Cup app) */
 --bg:#0a1230; --card:#121d44; --card2:#0e1736; --line:#22305f; --line2:#2e4076;
 --txt:#eef2ff; --dim:#8493c8; --dim2:#8493c8;
 --acc:#ff7a45; --accdark:#7e2f12; --gold:#ffc02e; --red:#ff5d5d;
 --rz-g:#2fd873; --rz-a:#ffc02e; --rz-r:#ff5d5d;
}
/* light theme (same family as the WC app light mode) */
html[data-theme="light"]{
 --bg:#eef1f8; --card:#ffffff; --card2:#e6ebf6; --line:#c3cde2; --line2:#9fb0d4;
 --txt:#0d1533; --dim:#51607e; --dim2:#6b7a9c;
 --acc:#c2451b; --accdark:#c2451b; --gold:#946400; --red:#c62828;
 --rz-g:#0f9d58; --rz-a:#a67c00; --rz-r:#c62828;
}
html[data-theme="light"] .stale{background:#fff3d6;border-color:#d9b64a;color:#7a5d00}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--txt);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{max-width:100%}
.hide{display:none!important}
#app{max-width:680px;margin:0 auto;padding:0 10px 40px;position:relative}

/* ---------- header ---------- */
.gkhead{display:flex;align-items:center;gap:10px;padding:14px 2px 10px}
/* brand tile stays Midnight Aubergine in BOTH themes (it is the app icon) */
.gklogo{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:linear-gradient(135deg,#2c1a40,#211235);display:flex;align-items:center;justify-content:center;border:1px solid var(--line2)}
.gklogo img{width:34px;height:34px;display:block}
.gktit{display:flex;flex-direction:column;min-width:0}
.gkname{font-family:'Alexandria','Cairo',system-ui,sans-serif;font-weight:800;font-size:21px;letter-spacing:.5px;line-height:1.15;color:var(--txt)}
.gkname b{color:var(--acc)}
.gkmotto{font-size:12.5px;color:var(--gold);font-weight:700;line-height:1.3}
.gkspacer{flex:1}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{padding:5px 12px;font-size:12px;font-weight:700;color:var(--dim)}
.seg button.on{background:var(--accdark);color:#fff}
.themebtn{padding:7px 9px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--dim);display:flex;align-items:center}
.themebtn svg{width:17px;height:17px}
html[data-theme="dark"] .ico-moon{display:none}
html[data-theme="light"] .ico-sun{display:none}
.setchip{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--dim);font-size:11.5px;font-weight:700}

/* ---------- settings sheet (WC-app style dropdown dialog) ---------- */
.sheet{position:absolute;top:60px;inset-inline-end:10px;z-index:70;width:min(340px,calc(100% - 20px));background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:0 14px 6px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.shtop{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.shttl{font-size:13px;font-weight:900;letter-spacing:.4px}
.shx{width:26px;height:26px;border-radius:50%;background:var(--card2);color:var(--dim);font-size:14px;line-height:1}
.shrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.shrow:last-of-type{border-bottom:none}
.shlab{font-size:13px;font-weight:700;color:var(--dim)}
.sheet select{background:var(--card2);color:var(--txt);border:1px solid var(--line2);border-radius:9px;padding:6px 10px;font-family:inherit;font-size:12.5px;font-weight:700;max-width:58%}
.shver{text-align:center;font-size:10px;color:var(--dim2);padding:8px 0 6px;letter-spacing:.5px;font-weight:700}
.shinstall{display:flex;width:100%;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:800;color:var(--acc);text-align:start}
.pushlgs{flex-wrap:wrap;justify-content:flex-start;gap:6px}
.pushlgs .shlab{flex-basis:100%}
.pushlgs .chip{padding:4px 11px;font-size:12px}

/* ---------- info bar (status dot + tz + clock, like the WC connbar) ---------- */
.infobar{display:flex;align-items:center;gap:8px;padding:2px 6px 8px;font-size:10.5px;color:var(--dim2);font-weight:700;letter-spacing:.3px}
.condot{width:7px;height:7px;border-radius:50%;background:var(--rz-g);flex:0 0 auto}
.condot.bad{background:var(--gold)}
.ibr{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.cz{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1px 8px;font-size:10px;font-weight:800}
.cz--off{color:var(--dim2)}
.clock{font-weight:900;color:var(--txt);font-size:12px;font-variant-numeric:tabular-nums}

/* ---------- league rail: 9 chips in two tidy rows, no scrolling ---------- */
.rail{position:sticky;top:0;z-index:40;background:linear-gradient(var(--bg) 85%,transparent);padding:6px 0 8px;display:flex;flex-wrap:wrap;gap:5px}
.railc{flex:1 1 calc(20% - 5px);min-width:calc(20% - 5px);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--dim)}
.railc.on{background:var(--accdark);border-color:var(--acc);color:#fff}
.railc .rico{font-size:16px;line-height:1.15}
.rflag{width:20px;height:14px;border-radius:2.5px;object-fit:cover;display:inline-block;vertical-align:middle;border:1px solid rgba(255,255,255,.12)}
.railc .rflag{margin:1px 0}
.lgphead .rflag{width:26px;height:18px}
.railc .rlbl{font-size:8.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ---------- date strip ---------- */
.dwrap{margin:2px 0 8px}
.dstrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.dstrip::-webkit-scrollbar{display:none}
.dc{flex:0 0 auto;width:52px;padding:6px 0 5px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:0}
.dc .wd{font-size:9.5px;letter-spacing:1px;color:var(--dim2);font-weight:700}
.dc .dn{font-size:17px;font-weight:800;line-height:1.2}
.dc .mo{font-size:10px;color:var(--dim)}
.dc.sel{background:var(--accdark);border-color:var(--acc)}
.dc.sel .wd,.dc.sel .mo{color:#ffd9c7}
.dc.tdy .dn{color:var(--gold)}
.dc.sel.tdy .dn{color:#fff}

/* ---------- counter + chips ---------- */
.cnt{font-size:12px;color:var(--dim);padding:0 4px 8px;font-weight:600}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:5px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap}
.chip.on{background:var(--accdark);border-color:var(--acc);color:#fff}
.chip.lv{color:var(--red)}
.chip.lv.on{background:#5b1717;border-color:var(--red);color:#fff}
.chip .cn{opacity:.75;font-size:11px}

/* ---------- stale / error ---------- */
.stale{display:flex;align-items:center;gap:8px;background:#2b2413;border:1px solid #57491f;color:var(--gold);border-radius:10px;padding:7px 12px;font-size:12px;font-weight:600;margin:0 0 10px}
.errbox{text-align:center;padding:40px 10px;color:var(--dim)}
.errbox .big{font-size:34px;margin-bottom:8px}
.retrybtn{margin-top:12px;padding:8px 22px;border-radius:10px;background:var(--accdark);color:#fff;font-weight:700;font-size:13px}

/* ---------- league sections (home) ---------- */
.lgsec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.lghead{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.lgopen{flex:1;display:flex;align-items:center;gap:9px;padding:10px 13px;min-width:0;text-align:start}
.lgico{font-size:16px;flex:0 0 auto}
.lgnm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgn{font-size:11px;color:var(--dim);background:var(--card2);border-radius:10px;padding:1px 8px;font-weight:700;flex:0 0 auto}
.lgarrow{color:var(--dim2);font-size:17px;font-weight:800;margin-inline-start:auto;flex:0 0 auto}
[dir=rtl] .lgarrow{transform:scaleX(-1)}
.fold{padding:10px 14px;color:var(--dim2);font-size:16px;font-weight:800;border-inline-start:1px solid var(--line)}

/* ---------- match rows ---------- */
.mrow{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;width:100%;padding:9px 10px;border-bottom:1px solid var(--line);gap:4px;text-align:center}
.mrow:last-child{border-bottom:none}
.mrow:active{background:var(--card2)}
.tm{display:flex;align-items:center;gap:7px;min-width:0}
.tmh{justify-content:flex-end;text-align:end}
.tma{justify-content:flex-start;text-align:start}
.tm i{font-style:normal;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crest{width:22px;height:22px;object-fit:contain;flex:0 0 auto}
.crestfb{width:22px;height:22px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);color:var(--dim);font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;letter-spacing:.3px}
.mid{display:flex;flex-direction:column;align-items:center;gap:1px}
.mtime{font-size:13.5px;font-weight:800;color:var(--txt)}
.msc{font-size:16px;font-weight:900;letter-spacing:1px}
.msc.live{color:var(--red)}
.msub{font-size:9.5px;color:var(--dim2);font-weight:700;letter-spacing:.4px}
.msub .lvm{color:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.lvdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite;vertical-align:middle;margin-inline-end:3px}

/* ---------- league page ---------- */
.lgphead{display:flex;align-items:center;gap:10px;padding:4px 2px 10px}
.lgphead .backbtn{padding:6px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:800;color:var(--dim)}
.backbtn span{display:inline-block}
[dir=ltr] .backbtn span{transform:scaleX(-1)}
.lgptit{font-size:17px;font-weight:900}
.lgpico{font-size:19px}
.ltabs{display:flex;gap:7px;padding:0 2px 12px}
.ltab{flex:1;padding:8px 0;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--dim)}
.ltab.on{background:var(--accdark);border-color:var(--acc);color:#fff}
.lseg{display:flex;gap:7px;padding:0 2px 12px}
.lsegb{padding:6px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--dim)}
.lsegb.on{background:var(--card2);border-color:var(--acc);color:#fff}
.dhead{font-size:12px;font-weight:800;color:var(--dim);padding:12px 6px 6px;letter-spacing:.3px}

/* ---------- standings table ---------- */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.trow{display:grid;grid-template-columns:30px 1fr 30px 26px 26px 26px 40px 40px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--line);font-size:12.5px}
.tgf,.tga{display:none}
@media(min-width:430px){
 .trow{grid-template-columns:30px 1fr 30px 26px 26px 26px 30px 30px 40px 40px}
 .tgf,.tga{display:block;text-align:center;color:var(--dim)}
}
.trow:last-child{border-bottom:none}
.trow.thead{color:var(--dim2);font-size:10.5px;font-weight:800;letter-spacing:.4px;background:var(--card2)}
.tpos{text-align:center;font-weight:800;position:relative}
.tpos::before{content:"";position:absolute;inset-block:4px;inset-inline-start:-8px;width:3px;border-radius:2px}
.zg .tpos::before{background:var(--rz-g)}
.za .tpos::before{background:var(--rz-a)}
.zr .tpos::before{background:var(--rz-r)}
.ttm{display:flex;align-items:center;gap:7px;min-width:0;font-weight:700}
.ttm i{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.tnum{text-align:center;color:var(--dim)}
.tpts{text-align:center;font-weight:900;color:#fff}
.tgd{text-align:center;color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:10px 6px;font-size:11px;color:var(--dim);font-weight:600}
.legend .zdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}
.seasonnote{font-size:11.5px;color:var(--gold);padding:8px 6px 0;font-weight:600}

/* ---------- stats ---------- */
.htiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.htile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px 26px;position:relative;overflow:hidden}
.htile::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--hacc,var(--gold))}
.htile .hcap{font-size:10px;color:var(--dim2);font-weight:800;letter-spacing:.5px}
.htile .hname{font-size:13.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htile .hteam{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htile .hnum{position:absolute;inset-inline-end:12px;bottom:4px;font-size:26px;font-weight:900;color:var(--hacc,var(--gold))}
.statcard{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.stath{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:900;font-size:14px}
.stath .ic{font-size:16px}
.srow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.srank{width:22px;text-align:center;font-weight:800;color:var(--dim);font-size:12px;flex:0 0 auto}
.srank.top{color:var(--gold)}
.sname{flex:1;min-width:0}
.sname b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sname span{display:block;font-size:10.5px;color:var(--dim2)}
.sval{font-size:18px;font-weight:900;color:var(--gold);flex:0 0 auto}
.morebtn{width:100%;padding:9px 0;font-size:12px;font-weight:700;color:var(--dim);background:var(--card2)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:520px){#modal{align-items:center}}
.mbox{background:var(--card);border:1px solid var(--line2);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:82vh;overflow-y:auto;padding:18px 16px 26px}
@media(min-width:520px){.mbox{border-radius:18px}}
.mx{position:sticky;top:0;float:inline-end;background:var(--card2);border-radius:50%;width:30px;height:30px;font-size:15px;color:var(--dim)}
.mvs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 0 4px}
.mvt{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.mvt img,.mvt .crestfb{width:44px;height:44px}
.mvt i{font-style:normal;font-size:12.5px;font-weight:800;text-align:center}
.mvsc{font-size:30px;font-weight:900;letter-spacing:2px}
.mvsc.live{color:var(--red)}
.mmeta{text-align:center;font-size:11.5px;color:var(--dim);padding:2px 0 12px;font-weight:600}
.evline{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:12.5px;border-bottom:1px solid var(--line)}
.evline:last-child{border-bottom:none}
.evmin{width:44px;color:var(--dim);font-weight:800;font-size:11px;flex:0 0 auto;text-align:center}
.evico{flex:0 0 auto}
.evtxt{font-weight:700}
.evside{margin-inline-start:auto;font-size:10px;color:var(--dim2);font-weight:700}
.mnoev{text-align:center;color:var(--dim2);font-size:12px;padding:14px 0}

/* ---------- misc ---------- */
.empty{text-align:center;color:var(--dim);padding:44px 10px}
.empty .big{font-size:36px;margin-bottom:10px}
footer{text-align:center;font-size:10.5px;color:var(--dim2);padding:26px 0 10px;letter-spacing:.4px;font-weight:600}
footer b{color:var(--dim)}
.skel{padding:30px 0;text-align:center;color:var(--dim2);font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-inline-end:8px}

/* ========== v1.2 readability scale-up (owner: app felt "zoomed out") ========== */
body{font-size:16px}
.gkhead{padding-top:calc(14px + env(safe-area-inset-top))}
.gkname{font-size:23px}
.gkmotto{font-size:13.5px}
.railc .rlbl{font-size:9.5px}
.dc{width:58px;padding:7px 0 6px}
.dc .dn{font-size:19px}
.dc .wd{font-size:10.5px}
.dc .mo{font-size:11px}
.cnt{font-size:13px}
.chip{font-size:13px;padding:6px 14px}
.lgnm{font-size:15px}
.lgn{font-size:12px}
.mrow{grid-template-columns:1fr 100px 1fr;padding:12px 10px}
.tm i{font-size:14px}
.crest,.crestfb{width:26px;height:26px}
.crestfb{font-size:9.5px}
.mtime{font-size:15px}
.msc{font-size:18.5px}
.msub{font-size:11px}
.ltab{font-size:14px;padding:10px 0}
.lsegb{font-size:13px}
.dhead{font-size:13px}
.trow{font-size:13.5px;padding:9px 8px}
.trow.thead{font-size:11.5px}
.ttm i{font-size:13.5px}
.trow .crest,.trow .crestfb{width:22px;height:22px}
.legend{font-size:12px}
.srow{padding:10px 14px}
.sname b{font-size:14.5px}
.sname span{font-size:11.5px}
.sval{font-size:20px}
.srank{font-size:13px}
.htile .hcap{font-size:11px}
.htile .hname{font-size:15px}
.htile .hteam{font-size:11.5px}
.htile .hnum{font-size:28px}
.mvt i{font-size:14px}
.mvsc{font-size:32px}
.mmeta{font-size:12.5px}
.evline{font-size:13.5px}
.stale{font-size:13px}
.morebtn{font-size:13px}
.infobar{font-size:11.5px}
.cz{font-size:11px}
.clock{font-size:13px}
.shlab{font-size:14px}
.sheet select{font-size:13.5px}
.seg button{font-size:13px}
.lgptit{font-size:19px}
.backbtn{font-size:16px}
footer{font-size:11px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
/* light theme: darker secondary text so small labels stay crisp on white */
html[data-theme="light"]{--dim:#44536f;--dim2:#5a6a8e}

/* ---------- bottom nav (mobile-app tabs) ---------- */
#app{padding-bottom:96px}
.bnav{position:fixed;bottom:0;inset-inline:0;max-width:680px;margin-inline:auto;z-index:60;display:flex;background:var(--card);border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:800;color:var(--dim2)}
.bnav button.on{color:var(--acc)}
.bnav .bnico{font-size:19px;line-height:1.1}

/* ---------- predictions ---------- */
.authcard{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:16px;text-align:center;margin-bottom:12px}

/* ============ utils ============ */

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
let _dkf = null, _dkfTz = "";
function dkey(d){
 try{
  if(_dkfTz !== TZ){ _dkf = new Intl.DateTimeFormat("en-CA", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"}); _dkfTz = TZ; }
  return Number(_dkf.format(d).replace(/-/g, ""));

}

function keyToDate(k){ return new Date(Math.floor(k / 10000), Math.floor(k / 100) % 100 - 1, k % 100); }
function addDaysKey(k, n){ const d = keyToDate(k); d.setDate(d.getDate() + n); return dkey(d); }
function rangeParam(k, before, after){ return addDaysKey(k, -(before)) + "-" + addDaysKey(k, after); }
function locale(){ return LANG === "ar" ? "ar-EG-u-nu-latn" : "en-GB"; }
function fmtTime(iso){ try{ return new Intl.DateTimeFormat(locale(), {hour:"numeric", minute:"2-digit", hour12:H12, timeZone:TZ}).format(new Date(iso)); }catch(_){ try{ return new Intl.DateTimeFormat(locale(), {hour:"numeric", minute:"2-digit", hour12:H12}).format(new Date(iso)); }catch(__){ return ""; } } }

function isHT(e){ const n = e.status && e.status.type && e.status.type.name; return n === "STATUS_HALFTIME"; }

/* ============ fetch layer (never blank UI; last-good kept) ============ */
async function jget(url){
 const ctl = new AbortController();
 const to = setTimeout(() => ctl.abort(), 12000);
 try{
  const r = await fetch(url, {cache:"no-store", signal:ctl.signal});
  if(!r.ok) throw new Error("http " + r.status);
  return await r.json();
 } finally { clearTimeout(to); }
}

/* ============ home: data ============ */
function eventsFor(lg, day){
 const c = dayCache[lg.id + "|" + day];
 if(!c) return null;
 const seen = {}; const out = [];
 for(const e of c.events){
  if(!e || !e.id || seen[e.id]) continue;
  seen[e.id] = 1;
  if(dkey(new Date(e.date)) === day) out.push(e);
 }
 out.sort((a, b) => new Date(a.date) - new Date(b.date));
 return out;
}
let _dayInflight = null, _dayInflightDay = 0;
async function loadDay(force){
 const day = selDay;
 if(_dayInflight && _dayInflightDay === day && !force) return _dayInflight;
 const seq = ++dayLoadSeq;
 const p = (async () => {
  const tk = todayKey();
  const nearToday = day === tk || day === addDaysKey(tk, -1);
  let anyFail = false;
  await Promise.all(LEAGUES.map(async lg => {
   const ck = lg.id + "|" + day;
   const c = dayCache[ck];
   const hasLive = c && c.events.some(e => evState(e) === "in");
   const ttl = hasLive ? 40000 : nearToday ? 120000 : 600000;
   if(!force && c && Date.now() - c.at < ttl) return;
   const slugs = [lg.slug].concat(lg.qual ? [lg.qual] : []);
   try{
    const results = await Promise.all(slugs.map(s => jget(API + s + "/scoreboard?dates=" + rangeParam(day, 1, 1))));
    const evs = [];
    results.forEach((j, si) => { (j && j.events || []).forEach(e => { if(si > 0) e._gkQual = 1; evs.push(e); }); });
    dayCache[ck] = {at: Date.now(), events: evs};
   }catch(_){ anyFail = true; /* keep last-good cache untouched */ }
  }));
  if(seq !== dayLoadSeq || view !== "home" || selDay !== day) return;
  dayFailed = anyFail;
  paintHome();
 })();
 _dayInflight = p; _dayInflightDay = day;
 try{ await p; } finally { if(_dayInflight === p) _dayInflight = null; }
}

function crestHtml(team){
 const nm = team && (team.abbreviation || team.shortDisplayName || team.displayName) || "";

 const url = team && (team.logo || (team.logos && team.logos[0] && team.logos[0].href));
 if(!url) return '<span class="crestfb">' + ini + "</span>";
 return '<img class="crest" src="' + esc(url) + '" alt="" loading="lazy" onerror="this.style.display=\'none\';if(this.nextElementSibling)this.nextElementSibling.style.display=\'flex\'"><span class="crestfb" style="display:none">' + ini + "</span>";
}
function teamName(c){ const tm = c && c.team || {}; return tm.shortDisplayName || tm.displayName || tm.name || "?"; }
function mrow(e, lg){

 const cs = comp.competitors || [];
 const H = cs.find(c => c.homeAway === "home") || cs[0] || {};
 const A = cs.find(c => c.homeAway === "away") || cs[1] || {};
 const s = evState(e);
 EV_INDEX[e.id] = e;
 const vk = voidedKey(e);

 }
 if(e._gkQual) sub += " · " + esc(t("qualTag"));
 return '<button type="button" class="mrow" data-eid="' + esc(e.id) + '" onclick="openMatch(this.dataset.eid)">' +
  '<span class="tm tmh">' + '<i>' + esc(teamName(H)) + "</i>" + crestHtml(H.team) + "</span>" +
  '<span class="mid">' + mid + '<span class="msub">' + sub + "</span></span>" +

function paintHome(){

 const day = selDay;
 let totalM = 0, comps = 0, liveN = 0, anyUnknown = false;

 for(const lg of LEAGUES){
  const evs = eventsFor(lg, day);
  if(evs === null){ anyUnknown = true; continue; }
  if(!evs.length) continue;
  comps++; totalM += evs.length;
  liveN += evs.filter(e => evState(e) === "in").length;
  perLg.push({lg, evs});
 }
 /* never leave a chip selected that can no longer render anything */
 if(chip === "live" && liveN === 0) chip = "all";
 if(chip !== "all" && chip !== "live" && !perLg.some(p => p.lg.id === chip)) chip = "all";
 $("cnt").textContent = totalM ? countLine(totalM, comps) : "";

 if(liveN > 0) ch += '<button type="button" class="chip lv' + (chip === "live" ? " on" : "") + '" onclick="setChip(\'live\')">● ' + esc(t("live")) + ' <span class="cn" dir="ltr">(' + liveN + ")</span></button>";
 for(const p of perLg){
  ch += '<button type="button" class="chip' + (chip === p.lg.id ? " on" : "") + '" onclick="setChip(\'' + p.lg.id + '\')">' + lgIcon(p.lg) + " " + esc(lgShort(p.lg)) + ' <span class="cn" dir="ltr">' + p.evs.length + "</span></button>";
 }
 $("chips").innerHTML = ch;
 /* stale bar: shown whenever the last load had a failure, no matter what else renders */
 const sb = $("staleBar");
 if(dayFailed){ sb.textContent = "⚠️ " + t("staleNote"); sb.classList.remove("hide"); }
 else sb.classList.add("hide");
 const cd = $("conDot");
 if(cd) cd.classList.toggle("bad", !!dayFailed);
 /* list */
 let h = "";
 for(const p of perLg){
  let list = p.evs;
  if(chip === "live"){ list = list.filter(e => evState(e) === "in"); if(!list.length) continue; }
  else if(chip !== "all" && chip !== p.lg.id) continue;

   '</div><div class="lgbody' + (folded ? " hide" : "") + '" id="fold_' + p.lg.id + '">' + list.map(e => mrow(e, p.lg)).join("") + "</div></section>";
 }
 if(!h){
  if(totalM === 0 && (anyUnknown || dayFailed)){

   h = '<div class="errbox"><div class="big">📡</div>' + esc(t("loadFail")) + '<br><button type="button" class="retrybtn" onclick="loadDay(true)">' + esc(t("retry")) + "</button></div>";
  } else {

/* ============ predictions: textdb storage (namespaced goalak_*, per-user pred keys) ============ */
const TDB_READ = "https://textdb.online/";
const TDB_WRITE = "https://api.textdb.online/update/";
/* Some ISP/router DNS setups cannot resolve textdb.online (found in QA). The push worker
   proxies the same store at /tdb, so storage works on those networks too. */
const TDB_PROXY = "https://goalak-push.ahmed-ayoty.workers.dev/tdb";
const ACCT_KEY = "goalak_accounts";
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function tdbRead(key, fallback){
 let txt = null;
 try{
  const r = await fetch(TDB_READ + key + "?t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error("http " + r.status);
  txt = (await r.text()).trim();
 }catch(_){
  const r2 = await fetch(TDB_PROXY + "/" + key + "?t=" + Date.now(), {cache:"no-store"});
  if(!r2.ok) throw new Error("proxy " + r2.status);
  txt = (await r2.text()).trim();
 }
 if(!txt) return fallback;
 try{ return JSON.parse(txt); }catch(_){ return fallback; }
}
async function tdbWrite(key, val){
 const body = "key=" + encodeURIComponent(key) + "&value=" + encodeURIComponent(JSON.stringify(val));
 const opts = {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body};
 try{
  const r = await fetch(TDB_WRITE, opts);
  if(!r.ok) throw new Error("write " + r.status);
 }catch(_){
  const r2 = await fetch(TDB_PROXY, opts);
  if(!r2.ok) throw new Error("proxy write " + r2.status);
 }
}
async function sha256(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join(""); }

let _am = "C";
function openAuth(mode){ _am = mode || "C"; updateAuthUI(); $("authModal").classList.remove("hide"); }

async function doAuth(){
 const u = ($("auUser").value || "").trim();
 const p = $("auPass").value || "";
 if(u.length < 2 || u.length > 18) return auShowErr(t("authBadUser"));
 if(p.length < 4) return auShowErr(t("authBadPass"));
 const go = $("auGo");
 go.disabled = true;
 try{
  let accts;
  try{ accts = await tdbRead(ACCT_KEY, null); }catch(_){ return auShowErr(t("authNet")); }
  accts = accts && typeof accts === "object" ? accts : {};
  const k = u.toLowerCase();
  if(_am === "L"){
   const a = accts[k];
   if(!a) return auShowErr(t("authNoUser"));
   if(await sha256(a.salt + p) !== a.hash) return auShowErr(t("authWrongPass"));
   finishAuth(a);
  } else {
   if(accts[k]) return auShowErr(t("authTaken"));
   const a = {uid:"g" + Math.random().toString(36).slice(2, 10), username:u, salt:Math.random().toString(36).slice(2, 10), hash:"", ts:Date.now()};
   a.hash = await sha256(a.salt + p);
   let saved = false, seen = 0;
   try{ seen = +localStorage.getItem("gk_acct_seen") || 0; }catch(_){}
   const cnt0 = Object.keys(accts).length;
   if(cnt0 > seen){ seen = cnt0; try{ localStorage.setItem("gk_acct_seen", String(cnt0)); }catch(_){} }
   for(let i = 0; i < 3 && !saved; i++){
    try{
     const fresh = await tdbRead(ACCT_KEY, null);           /* re-read fresh so concurrent signups aren't clobbered */
     const obj = fresh && typeof fresh === "object" ? fresh : {};
     const cnt = Object.keys(obj).length;
     if(cnt > seen){ seen = cnt; try{ localStorage.setItem("gk_acct_seen", String(cnt)); }catch(_){} }
     if(cnt === 0 && seen > 0){ await sleep(500); continue; } /* WIPE GUARD: never write over a suspicious empty read */
     if(obj[k]) return auShowErr(t("authTaken"));
     obj[k] = a;
     const want = Object.keys(obj).length;
     await tdbWrite(ACCT_KEY, obj);
     await sleep(350);
     const chk = await tdbRead(ACCT_KEY, null);
     if(chk && chk[k] && Object.keys(chk).length >= want) saved = true; /* landed AND nobody else's account dropped */
    }catch(_){ await sleep(350); }
   }
   if(!saved) return auShowErr(t("authSaveFail"));
   finishAuth(a);
  }
 } finally { go.disabled = false; }
}
function finishAuth(a){
 gkUser = {uid:a.uid, username:a.username};
 try{ localStorage.setItem("gk_user", JSON.stringify(gkUser)); }catch(_){}
 myPreds = {};
 try{ localStorage.removeItem("gk_preds"); }catch(_){}
 closeAuth();
 syncMyPreds();
 savePushSub(); /* attach uid/name to an existing push subscription */
 renderPred();
}

let predTab = "M";
const predCache = {up:null, res:null, at:0};
let _predInflight = null;
function showMain(v){
 mainView = v;
 $("bnScores").classList.toggle("on", v === "scores");
 $("bnPred").classList.toggle("on", v === "pred");

async function loadPredData(force){
 if(_predInflight && !force) return _predInflight;
 if(!force && predCache.at && Date.now() - predCache.at < 90000) return;
 const p = (async () => {
  const lgs = LEAGUES.filter(l => l.pred);
  const tk = todayKey();
  try{
   /* results window reaches back to season start (2026-08-01) so leaderboard points never decay */
  const resDays = Math.min(150, Math.max(14, Math.floor((Date.now() - Date.UTC(2026, 7, 1)) / 86400000) + 2));
  const results = await Promise.all(
    lgs.map(l => jget(API + l.slug + "/scoreboard?dates=" + rangeParam(tk, 0, 14)))
    .concat(lgs.map(l => jget(API + l.slug + "/scoreboard?dates=" + rangeParam(tk, resDays, 0))))
   );
   const all = {};
   results.forEach((j, idx) => {
    const lgid = lgs[idx % lgs.length].id;
    (j && j.events || []).forEach(e => { if(e && e.id && !all[e.id]){ e._gkLg = lgid; all[e.id] = e; } });
   });
   const evs = Object.values(all);
   evs.forEach(e => { EV_INDEX[e.id] = e; });
   predCache.up = evs.filter(e => evState(e) !== "post" && !voidedKey(e)).sort((a, b) => new Date(a.date) - new Date(b.date));
   predCache.res = evs.filter(e => evState(e) === "post" && !voidedKey(e)).sort((a, b) => new Date(b.date) - new Date(a.date));
   predCache.at = Date.now();
  }catch(_){
   if(!predCache.at && mainView === "pred") $("predBody").innerHTML = '<div class="errbox"><div class="big">📡</div>' + esc(t("loadFail")) + '<br><button type="button" class="retrybtn" onclick="loadPredData(true)">' + esc(t("retry")) + "</button></div>";
   return;
  }
  if(mainView === "pred") renderPred();
 })();
 _predInflight = p;
 try{ await p; } finally { if(_predInflight === p) _predInflight = null; }
}
function predLocked(e){ return Date.now() > (new Date(e.date).getTime() - 30 * 60000); }
function pickTxt(pred){ return LANG === "ar" ? (pred.a + " - " + pred.h) : (pred.h + " - " + pred.a); }
function scorePredGk(pred, e){
 const comp = e.competitions && e.competitions[0] || {};
 const cs = comp.competitors || [];
 const H = cs.find(c => c.homeAway === "home") || {}, A = cs.find(c => c.homeAway === "away") || {};
 const rh = parseInt(H.score, 10), ra = parseInt(A.score, 10);
 if(!(rh >= 0) || !(ra >= 0)) return 0;
 if(pred.h === rh && pred.a === ra) return 3;
 const sg = x => x > 0 ? 1 : x < 0 ? -1 : 0;
 return sg(pred.h - pred.a) === sg(rh - ra) ? 1 : 0;
}

 if(predTab === "M") renderPredMatches(); else renderLeaderboard();
}

 const cs = comp.competitors || [];
 const H = cs.find(c => c.homeAway === "home") || cs[0] || {}, A = cs.find(c => c.homeAway === "away") || cs[1] || {};
 const lg = LEAGUES.find(l => l.id === e._gkLg);
 const mine = myPreds[e.id];
 const locked = predLocked(e) || evState(e) !== "pre";
 let mid;
 if(mine){

  mid = '<span class="pin" dir="ltr">' + pair + "</span>" +
   '<button type="button" class="pgo" data-eid="' + esc(e.id) + '" onclick="submitPredGk(this.dataset.eid, this)">' + esc(t("saveBtn")) + "</button>";
 }
 return '<div class="lgsec"><div class="lgbody"><div class="mrow prow">' +

  '<span class="tm tma">' + crestHtml(A.team) + "<i>" + esc(teamName(A)) + "</i></span>" +
  "</div></div></div>";
}
function predResultRow(e){
 const comp = e.competitions && e.competitions[0] || {};
 const cs = comp.competitors || [];
 const H = cs.find(c => c.homeAway === "home") || cs[0] || {}, A = cs.find(c => c.homeAway === "away") || cs[1] || {};
 const mine = myPreds[e.id];
 const pts = mine ? scorePredGk(mine, e) : null;
 const sub = mine
  ? esc(t("yourPick")) + ' <span dir="ltr">' + esc(pickTxt(mine)) + "</span> · " + (pts === 3 ? "🎯 +3" : pts === 1 ? "✅ +1" : "0")
  : esc(t("noPick"));

function renderPredMatches(){
 const body = $("predBody");
 if(!predCache.at){ body.innerHTML = '<div class="skel"><span class="spinner"></span>' + esc(t("loading")) + "</div>"; return; }
 let h = "", lastDay = 0;
 const upcoming = predCache.up.slice(0, 40);
 if(!upcoming.length) h += '<div class="empty"><div class="big">🗓️</div>' + esc(t("noUpcoming")) + "</div>";
 for(const e of upcoming){
  const k = dkey(new Date(e.date));

  h += predCard(e);
 }

async function submitPredGk(eid, btn){
 if(!gkUser) return openAuth("C");
 const e = EV_INDEX[eid];
 if(!e) return;
 if(predLocked(e) || evState(e) !== "pre"){ toastMsg(t("lockedNow")); renderPredMatches(); return; }
 const hv = $("ph_" + eid), av = $("pa_" + eid);
 const h = parseInt(hv && hv.value, 10), a = parseInt(av && av.value, 10);
 if(!(h >= 0 && h <= 20) || !(a >= 0 && a <= 20)) return toastMsg(t("badScore"));
 if(myPreds[eid]) return renderPredMatches();
 btn.disabled = true;
 const key = predKeyFor(gkUser.uid);
 let ok = false;
 for(let i = 0; i < 3 && !ok; i++){
  try{
   const mineR = await tdbRead(key, null);
   const mine = mineR && typeof mineR === "object" ? mineR : {};
   mine.n = gkUser.username;
   mine.p = mine.p || {};
   if(!mine.p[eid]) mine.p[eid] = {h:h, a:a, ts:Date.now()};   /* one submission per match, never overwritten */
   await tdbWrite(key, mine);
   await sleep(300);
   const chk = await tdbRead(key, null);
   if(chk && chk.p && chk.p[eid]){ ok = true; myPreds = chk.p; }
  }catch(_){ await sleep(350); }
 }
 btn.disabled = false;
 if(!ok) return toastMsg(t("authSaveFail"));
 try{ localStorage.setItem("gk_preds", JSON.stringify(myPreds)); }catch(_){}
 const landed = myPreds[eid];
 toastMsg(landed && (landed.h !== h || landed.a !== a) ? t("alreadyPicked") : t("savedOk"));
 renderPredMatches();
}
let lbCache = {at:0, rows:null};
async function renderLeaderboard(){
 const body = $("predBody");
 if(lbCache.rows && Date.now() - lbCache.at < 60000){ body.innerHTML = lbHtml(lbCache.rows); return; }
 /* keep last-good rows on screen while refreshing; skeleton only on first ever load */
 body.innerHTML = lbCache.rows ? lbHtml(lbCache.rows) : '<div class="skel"><span class="spinner"></span>' + esc(t("loading")) + "</div>";
 try{
  const acctsR = await tdbRead(ACCT_KEY, null);
  const accts = acctsR && typeof acctsR === "object" ? acctsR : {};
  const users = Object.values(accts).slice(0, 100);
  if(!users.length){ body.innerHTML = '<div class="empty"><div class="big">🏆</div>' + esc(t("lbEmpty")) + "</div>"; return; }
  if(!predCache.at) await loadPredData(true);
  if(!predCache.at) throw new Error("no results data"); /* never render an all-zero board off a failed fetch */
  const doneMap = {};
  (predCache.res || []).forEach(e => { doneMap[e.id] = e; });
  const packs = await Promise.all(users.map(u => tdbRead(predKeyFor(u.uid), null).catch(() => null)));
  const rows = packs.map((pk, i) => {
   const u = users[i];
   let pts = 0, exact = 0;
   if(pk && pk.p) for(const eid in pk.p){ const e = doneMap[eid]; if(!e) continue; const s = scorePredGk(pk.p[eid], e); pts += s; if(s === 3) exact++; }
   return {name:u.username, uid:u.uid, pts, exact};
  });
  rows.sort((a, b) => b.pts - a.pts || b.exact - a.exact || String(a.name).localeCompare(String(b.name)));
  lbCache = {at:Date.now(), rows};
  if(mainView === "pred" && predTab === "L") body.innerHTML = lbHtml(rows);
 }catch(_){
  if(lbCache.rows){ body.innerHTML = '<div class="stale">⚠️ ' + esc(t("staleNote")) + "</div>" + lbHtml(lbCache.rows); }
  else body.innerHTML = '<div class="errbox"><div class="big">📡</div>' + esc(t("loadFail")) + '<br><button type="button" class="retrybtn" onclick="lbCache.at=0;renderLeaderboard()">' + esc(t("retry")) + "</button></div>";
 }
}

/* ============ push notifications (client) ============ */
const GK_VAPID_PUBLIC = "BLyDli3t0W8TTo9gL7s4ibxgVJY6_ism0HIyn8DymerLNs1Bs9mo5ct5i_wti8NNUQ_pfXxMXXZfJKdg1Gc02RM";
const PUSH_SUBS_KEY = "goalak_push_subs";
let pushLgs = [];
try{ pushLgs = JSON.parse(localStorage.getItem("gk_push_lgs") || "[]"); }catch(_){}
function allLgIds(){ return LEAGUES.map(l => l.id).filter((v, i, a) => a.indexOf(v) === i); }
function pushUiState(on){
 const onB = $("pushOnB"), offB = $("pushOffB");
 if(!onB) return;
 onB.classList.toggle("on", !!on);
 offB.classList.toggle("on", !on);

function renderPushLgs(){
 const seenIds = {}; const uniq = [];
 for(const lg of LEAGUES){ if(!seenIds[lg.id]){ seenIds[lg.id] = 1; uniq.push(lg); } }
 $("pushLgRow").innerHTML = '<span class="shlab">' + esc(t("pushLeagues")) + "</span>" +
  uniq.map(lg => '<button type="button" class="chip' + (!pushLgs.length || pushLgs.includes(lg.id) ? " on" : "") + '" onclick="togglePushLg(\'' + lg.id + '\')">' + esc(lgShort(lg)) + "</button>").join("");
}
function togglePushLg(id){
 const all = allLgIds();
 if(!pushLgs.length) pushLgs = all.slice();
 if(pushLgs.includes(id)){
  if(pushLgs.length === 1) return toastMsg(t("pushKeepOne"));
  pushLgs = pushLgs.filter(x => x !== id);
 } else pushLgs = pushLgs.concat([id]);
 if(pushLgs.length === all.length) pushLgs = [];
 try{ localStorage.setItem("gk_push_lgs", JSON.stringify(pushLgs)); }catch(_){}
 renderPushLgs();
 savePushSub();
}
function b64urlKey(s){
 const b64 = s.replace(/-/g, "+").replace(/_/g, "/");
 const pad = b64 + "=".repeat((4 - b64.length % 4) % 4);
 const bin = atob(pad);
 const u = new Uint8Array(bin.length);
 for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
 return u;
}
async function setPush(on){
 if(!on){
  pushUiState(false);
  try{
   const reg = await navigator.serviceWorker.ready;
   const sub = await reg.pushManager.getSubscription();
   if(sub){ const ep = sub.endpoint; await sub.unsubscribe().catch(() => {}); await removePushSub(ep); }
  }catch(_){}
  return;
 }
 if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)){ toastMsg(t("pushUnsupported")); pushUiState(false); return; }
 if(isIOS() && !isStandalone()){ toastMsg(t("pushIosInstall")); pushUiState(false); return; }
 try{
  const perm = await Notification.requestPermission();
  if(perm !== "granted"){ toastMsg(t("pushDenied")); pushUiState(false); return; }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64urlKey(GK_VAPID_PUBLIC) });
  const saved = await savePushSub(sub);
  if(!saved){ try{ await sub.unsubscribe(); }catch(_){} toastMsg(t("authNet")); pushUiState(false); return; }
  pushUiState(true);
  toastMsg(t("pushOnOk"));
 }catch(_){ toastMsg(t("authNet")); pushUiState(false); }
}
function subsSeen(){ try{ return +localStorage.getItem("gk_subs_seen") || 0; }catch(_){ return 0; } }
function subsSeenUpd(n){ try{ if(n > subsSeen()) localStorage.setItem("gk_subs_seen", String(n)); }catch(_){} }
async function savePushSub(subObj){
 /* returns true only when the record is CONFIRMED present without shrinking the shared list (wipe guard, QA finding) */
 try{
  if(!("serviceWorker" in navigator)) return false;
  const reg = await navigator.serviceWorker.ready;
  const sub = subObj || await reg.pushManager.getSubscription();
  if(!sub) return false;
  const j = sub.toJSON();
  const rec = { endpoint:j.endpoint, keys:j.keys, lgs:pushLgs, lang:LANG, uid:gkUser ? gkUser.uid : null, name:gkUser ? gkUser.username : null, ts:Date.now() };
  for(let i = 0; i < 3; i++){
   try{
    const listR = await tdbRead(PUSH_SUBS_KEY, null);
    const list = Array.isArray(listR) ? listR : [];
    subsSeenUpd(list.length);
    if(list.length === 0 && subsSeen() > 1){ await sleep(400); continue; } /* suspicious empty read: never write over it */
    const next = list.filter(s => s && s.endpoint !== rec.endpoint);
    next.push(rec);
    await tdbWrite(PUSH_SUBS_KEY, next);
    await sleep(300);
    const chk = await tdbRead(PUSH_SUBS_KEY, null);
    if(Array.isArray(chk) && chk.some(s => s && s.endpoint === rec.endpoint) && chk.length >= next.length){ subsSeenUpd(chk.length); return true; }
   }catch(_){ await sleep(300); }
  }
 }catch(_){}
 return false;
}
async function removePushSub(ep){
 for(let i = 0; i < 3; i++){
  try{
   const listR = await tdbRead(PUSH_SUBS_KEY, null);
   const list = Array.isArray(listR) ? listR : [];
   if(list.length === 0) return; /* nothing to remove; never write an empty list over a failed read */
   subsSeenUpd(list.length);
   const next = list.filter(s => s && s.endpoint !== ep);
   if(next.length === list.length) return;
   await tdbWrite(PUSH_SUBS_KEY, next);
   await sleep(250);
   const chk = await tdbRead(PUSH_SUBS_KEY, null);
   if(Array.isArray(chk) && !chk.some(s => s && s.endpoint === ep) && chk.length >= next.length) return;
  }catch(_){ await sleep(300); }
 }
}
async function refreshPushUI(){
 let on = false;
 try{
  if("serviceWorker" in navigator && "PushManager" in window && "Notification" in window && Notification.permission === "granted"){
   const reg = await navigator.serviceWorker.ready;

 }catch(_){}

}
