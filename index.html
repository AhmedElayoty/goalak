async function renewStoredChatSession(){
 /* This demanded a session that was ALREADY valid, so calling it to rescue one that had just
    lapsed returned false without trying — the "one silent renewal attempt" was fiction and the
    user was sent to a password prompt they never needed to see. It renews any token that has
    not actually expired yet; the server is the one that decides. */
 if(!gkUser || !chatSession || !chatSession.token || chatSession.uid !== gkUser.uid) return false;
 if(Number(chatSession.exp) <= Date.now()) return false;
 if(Number(chatSession.exp) - Date.now() > 7 * 86400000) return true;
 try{
  const r = await fetch(CHAT_API + "/api/session/refresh", {method:"POST", headers:chatAuthHeaders(), cache:"no-store"});
  const j = await r.json().catch(() => ({}));
  if(r.ok && j.ok && j.token && j.user && gkUser && j.user.uid === gkUser.uid){
   storeChatSession({token:j.token, exp:Number(j.exp) || 0, uid:j.user.uid});
  }
 }catch(_){ /* the current signed token remains usable until its real expiry */ }
 return validChatSession();
}

async function doAuthLegacy(){
 const u = ($("auUser").value || "").trim();
 const p = $("auPass").value || "";
 const go = $("auGo");
 go.disabled = true;
 try{
  let accts;
  try{ accts = await tdbRead(ACCT_KEY, null); }catch(_){ return auShowErr(t("authNet")); }
  accts = accts && typeof accts === "object" ? accts : {};
  const k = u.toLowerCase();
  if(_am === "L"){
   const a = accts[k];
   if(!a) return auShowErr(t("authNoUser"));
   if(await sha256(a.salt + p) !== a.hash) return auShowErr(t("authWrongPass"));
    await finishAuth(a, p);
  } else {
   if(accts[k]) return auShowErr(t("authTaken"));
   const a = {uid:"g" + Math.random().toString(36).slice(2, 10), username:u, salt:Math.random().toString(36).slice(2, 10), hash:"", ts:Date.now()};
   a.hash = await sha256(a.salt + p);
   const pickedClub = clubFromSelValue(($("auClub") || {}).value || "");
   if(pickedClub) a.club = pickedClub;
   let saved = false, seen = 0;
   try{ seen = +localStorage.getItem("gk_acct_seen") || 0; }catch(_){}
   const cnt0 = Object.keys(accts).length;
   if(cnt0 > seen){ seen = cnt0; try{ localStorage.setItem("gk_acct_seen", String(cnt0)); }catch(_){} }
   for(let i = 0; i < 3 && !saved; i++){
    try{
     const fresh = await tdbRead(ACCT_KEY, null);           /* re-read fresh so concurrent signups aren't clobbered */
     const obj = fresh && typeof fresh === "object" ? fresh : {};
     const cnt = Object.keys(obj).length;
     if(cnt > seen){ seen = cnt; try{ localStorage.setItem("gk_acct_seen", String(cnt)); }catch(_){} }
     if(cnt === 0 && seen > 0){ await sleep(500); continue; } /* WIPE GUARD: never write over a suspicious empty read */
     if(obj[k]) return auShowErr(t("authTaken"));
     obj[k] = a;
     const want = Object.keys(obj).length;
     await tdbWrite(ACCT_KEY, obj);
     await sleep(350);
     const chk = await tdbRead(ACCT_KEY, null);
     if(chk && chk[k] && Object.keys(chk).length >= want) saved = true; /* landed AND nobody else's account dropped */
    }catch(_){ await sleep(350); }
   }
   if(!saved) return auShowErr(t("authSaveFail"));
    await finishAuth(a, p);
  }
 } finally { go.disabled = false; }
}

async function loadPredData(force){

   /* Results window reaches back to THIS season's start so leaderboard points never decay.
      No cap and no hardcoded year: a Math.min() here would silently shave a player's earliest
      correct predictions off their total every day once the season passed the cap. */
  const resDays = Math.max(14, Math.floor((Date.now() - seasonStartMs()) / 86400000) + 2);
  const jobs = [];
  for(const l of lgs){
   /* Predictions are for the Champions League proper only, never qualifying rounds. */
   jobs.push({slug:l.slug, id:l.id, range:rangeParam(tk, 0, 14)});

  const results = await Promise.all(jobs.map(jb => jget(sbUrl(jb.slug, jb.range))));
   const all = {};

   });
   const evs = Object.values(all);

   predCache.res = evs.filter(e => evState(e) === "post" && !voidedKey(e)).sort((a, b) => new Date(b.date) - new Date(a.date));
   predCache.at = Date.now();

 const rh = parseInt(H.score, 10), ra = parseInt(A.score, 10);
 if(!(rh >= 0) || !(ra >= 0)) return 0;
 /* THE WORLD CUP APP'S KNOCKOUT RULES, PORTED WHOLE - they carried a full tournament there.
    ESPN's score for an extra-time match is already the 120-minute score, and a shootout
    arrives separately as shootoutScore. So: the match is scored on the 120-minute result;
    EXACT additionally requires that no shootout happened (a scoreline pick did not predict
    "level, then penalties"); and when it went to penalties, the shootout winner IS the match
    winner for the outcome point - predicting the draw on a pens match scores nothing, the
    match had a winner. A genuine draw (a first leg) still pays the outcome point. Inert until
    February: the league phase cannot go to extra time. */
 const so = H.shootoutScore != null && A.shootoutScore != null
         && (+H.shootoutScore !== 0 || +A.shootoutScore !== 0);
 if(pred.pens){
  /* the WC pens PICK: full marks if it went to penalties AND the named side won them;
     the outcome point if the named side won but it was decided in normal or extra time */
  const winner = so ? (+H.shootoutScore > +A.shootoutScore ? "home" : "away")
                    : (rh > ra ? "home" : ra > rh ? "away" : null);
  if(so && pred.w === winner) return 3;
  return pred.w === winner ? 1 : 0;
 }
 if(!so && pred.h === rh && pred.a === ra) return 3;
 const sg = x => x > 0 ? 1 : x < 0 ? -1 : 0;
 const win = so ? (+H.shootoutScore > +A.shootoutScore ? 1 : -1) : sg(rh - ra);
 return sg(pred.h - pred.a) === win ? 1 : 0;
}

async function renderLeaderboard(){

 try{
  /* ONE REQUEST FOR THE WHOLE BOARD. It used to read the accounts blob and then fire one
     request per player straight from the browser — a hundred in parallel, every sixty
     seconds, at a free store — which is precisely the load that produces the rate-limited
     bodies that then scored everybody zero. It was also capped at the hundred OLDEST
     accounts, so the hundred-and-first player could never appear on it however well they
     predicted. */
  if(!validChatSession()){ try{ await renewStoredChatSession(); }catch(_){} }
  const lbR = await fetch(CHAT_API + "/api/pred/leaderboard", {headers:chatAuthHeaders(), cache:"no-store"});
  const lbJ = await lbR.json().catch(() => ({}));
  if(!lbR.ok || !lbJ.ok || !Array.isArray(lbJ.users)) throw new Error("board");
  const users = lbJ.users;
  if(!users.length){ body.innerHTML = '<div class="empty"><div class="big">🏆</div>' + esc(t("lbEmpty")) + "</div>"; return; }
  if(!predCache.at) await loadPredData(true);
  /* results feed down: say so specifically instead of a generic "could not load" over a healthy board */
  if(!predCache.at){
   body.innerHTML = '<div class="stale">⚠️ ' + esc(t("lbNoResults")) + "</div>" +
    (lbCache.rows ? lbHtml(lbCache.rows) : '<div class="errbox"><div class="big">📡</div><button type="button" class="retrybtn" onclick="lbCache.at=0;renderLeaderboard()">' + esc(t("retry")) + "</button></div>");
   return;
  }
  const doneMap = {};
  (predCache.res || []).forEach(e => { doneMap[e.id] = e; });
  /* A read that FAILED is not a player who scored zero. Keep the two apart: a flaky request must
     never drop a real player to the bottom of the board. WC lesson 2.2. */
  const rows = [];
  users.forEach(u => {
   const pk = u.picks || {};
   let pts = 0, exact = 0;
   for(const eid in pk){ const e = doneMap[eid]; if(!e) continue; const s = scorePredGk(pk[eid], e); pts += s; if(s === 3) exact++; }
   rows.push({name:u.username, uid:u.uid, pts, exact, played:u.played || 0, club:u.club || null});
  });
  /* A BOARD IS PEOPLE WHO HAVE PLAYED. Every registered account was pushed onto it at zero,
     which put somebody who has never made a prediction on the podium with a crown on. */
  const scored = rows.filter(r => r.played > 0);
  const shown = scored.length ? scored : rows;
  shown.sort((a, b) => b.pts - a.pts || b.exact - a.exact || b.played - a.played || String(a.name).localeCompare(String(b.name)));

 }catch(_){
  if(lbCache.rows){ body.innerHTML = '<div class="stale">⚠️ ' + esc(t("staleNote")) + "</div>" + lbHtml(lbCache.rows); }
  else body.innerHTML = '<div class="errbox"><div class="big">📡</div>' + esc(t("loadFail")) + '<br><button type="button" class="retrybtn" onclick="lbCache.at=0;renderLeaderboard()">' + esc(t("retry")) + "</button></div>";
 }
}

   to sort first out of two players on identical scores. */
function rankOf(rows, r){

      class name meant two players tied on top rendered as p1, p1, p3 — the second-place plinth
      got the full gold treatment and two crowns appeared side by side, and there is no .p2
      rule at all. The podium keeps its shape; the tie shows in the number. */
   const seat = top.indexOf(r) === 1 ? 1 : top.indexOf(r) === 0 ? 2 : 3;
   /* the crown belongs to the CENTRE plinth, not to everyone whose number is 1 — a two-way tie

   return '<div class="pod p' + seat + '"><span class="pava">' + (seat === 1 ? '<span class="pcrown">👑</span>' : "") + esc(String(r.name || "?").charAt(0).toUpperCase()) +

/* ---- the coming month, across every competition the club is in ---- */
const TMFX_SLUGS_EU = ["uefa.champions", "uefa.europa", "uefa.europa.conf", "club.friendly"];
async function teamFixtures(c){
 /* the rows are stored LOCALIZED, so the language is part of the key - a 6-hour cache must
    not answer an English screen in Arabic after a language switch */
 const key = "gk_tmfx3_" + c.id + "_" + LANG;
 try{
  const cached = JSON.parse(localStorage.getItem(key) || "null");
  if(cached && Date.now() - cached.at < 6 * 3600000) return cached.rows;
 }catch(_){}
 const lg = LEAGUES.find(l => l.id === c.lg);
 const slugs = (lg ? [lg.slug] : []).concat(TMFX_SLUGS_EU);
 const seen = {}, rows = [];
 const from = Date.now() - 6 * 3600000, to = Date.now() + 35 * 86400000;
 await Promise.all(slugs.map(async slug => {
  try{
   /* ESPN's schedule endpoint answers with PLAYED matches by default; the coming ones only
      exist behind ?fixture=true - without it every club "had no fixtures" for ever */
   const j = await jget(API + slug + "/teams/" + encodeURIComponent(c.id) + "/schedule?fixture=true");
   for(const e of (j && j.events) || []){
    const d = Date.parse(e.date);
    if(!(d >= from && d <= to) || seen[e.id]) continue;
    seen[e.id] = 1;
    const cs = (e.competitions && e.competitions[0] && e.competitions[0].competitors) || [];
    const me = cs.find(x => x.team && String(x.team.id) === String(c.id)) || {};
    const opp = cs.find(x => x !== me) || {};
    rows.push({d: d, iso: e.date, home: me.homeAway === "home",
               opp: opp.team ? clubAr(opp.team) : (e.shortName || ""),
               /* the crest rides along - the schedule feed carries logos[0] for every club */
               logo: (opp.team && (opp.team.logo || (opp.team.logos && opp.team.logos[0] && opp.team.logos[0].href))) || "",
               comp: slugComp(slug)});
   }
  }catch(_){ /* a competition the club is not in simply contributes nothing */ }
 }));
 rows.sort((a, b) => a.d - b.d);
 try{ localStorage.setItem(key, JSON.stringify({at: Date.now(), rows: rows})); }catch(_){}
 return rows;
}
function slugComp(slug){
 if(slug === "uefa.champions") return LANG === "ar" ? "أبطال أوروبا" : "UCL";
 if(slug === "uefa.europa") return LANG === "ar" ? "الدوري الأوروبي" : "UEL";
 if(slug === "uefa.europa.conf") return LANG === "ar" ? "المؤتمر الأوروبي" : "UECL";
 if(slug === "club.friendly") return LANG === "ar" ? "ودية" : "Friendly";
 const lg = LEAGUES.find(l => l.slug === slug);
 return lg ? lgShort(lg) : "";
}

async function saveClubToAccount(){
 if(!gkUser) return;
 /* THE CLUB NOW LIVES IN TWO PLACES AND ONLY ONE OF THEM WAS BEING WRITTEN.
    Sign-in reads it back from the worker (finishAuth), the leaderboard badge reads it from the
    worker, and the personalised live match card is targeted from the worker - but changing your
    club still only rewrote the textdb accounts blob. So anybody who picked a club AFTER signing
    up lost it the next time they signed in, and quietly stopped being targeted by the live
    card. The worker is written first because it is the one that matters; the textdb copy stays
    until the chat club chips, which still read that blob, move across too. */
 if(validChatSession()){
  try{ await apiAuthAuthed("set-club", {club: myClub || null}); }catch(_){}
 }
 const k = gkUser.username.toLowerCase();
 /* This rewrites the WHOLE shared accounts object, so it carries the same wipe guard and
    verify-after-write as doAuth: a stale snapshot written back would delete every account
    created since the read. WC chat rules / goalak-v9. */
 let seen = 0;
 try{ seen = +localStorage.getItem("gk_acct_seen") || 0; }catch(_){}
 for(let i = 0; i < 3; i++){
  try{
   const fresh = await tdbRead(ACCT_KEY, null);
   const obj = fresh && typeof fresh === "object" ? fresh : {};
   const cnt = Object.keys(obj).length;
   if(cnt > seen){ seen = cnt; try{ localStorage.setItem("gk_acct_seen", String(cnt)); }catch(_){} }
   if(cnt === 0 && seen > 0){ await sleep(400); continue; }   /* WIPE GUARD */
   if(!obj[k]) return;                                        /* account not there: nothing to attach a club to */
   obj[k].club = myClub ? {id:myClub.id, n:myClub.n, s:myClub.s, lg:myClub.lg} : null;
   const want = Object.keys(obj).length;
   await tdbWrite(ACCT_KEY, obj);
   await sleep(350);
   const chk = await tdbRead(ACCT_KEY, null);
   if(chk && chk[k] && Object.keys(chk).length >= want) return;   /* landed AND nobody was dropped */
  }catch(_){ await sleep(350); }
 }
}

async function renderClubHero(force){
 try{ renderTeamStrip(); }catch(_){}
 const el = $("clubHero");
 if(!el) return;
 if(!myClub){ el.innerHTML = ""; return; }
 if(!force && _clubSched && Date.now() - _clubSched.at < 6 * 3600000){ paintClubHero(); return; }
 try{
  const lg = LEAGUES.find(l => l.id === myClub.lg);
  if(!lg){ el.innerHTML = ""; return; }
  /* next fixture from the CORS-open scoreboard feed (the /schedule endpoint has no CORS header) */
  const j = await jget(sbUrl(lg.slug, rangeParam(todayKey(), 1, 30)));   /* start yesterday: a match that kicked off before midnight is still live — F-40 */
  const evs = ((j && j.events) || []).filter(e => {
   if(!e || !e.date || voidedKey(e) || evState(e) === "post") return false;
   const cs = (e.competitions && e.competitions[0] && e.competitions[0].competitors) || [];
   return cs.some(c => c && c.team && String(c.team.id) === String(myClub.id));
  });

  _clubSched = {at:Date.now(), ev:evs[0] || null};
 }catch(_){ if(!_clubSched) return; /* keep last-good hero on transient failure */ }
 paintClubHero();
}

function safeChatClub(value){
 if(!value || !value.id) return null;
 return {id:String(value.id).slice(0, 40), n:String(value.n || "").slice(0, 100), s:String(value.s || "").slice(0, 100), lg:String(value.lg || "").slice(0, 20)};

async function loadChatClubs(force){
 if(!force && chatClubsAt && Date.now() - chatClubsAt < 120000) return;
 try{
  const accounts = await tdbRead(ACCT_KEY, null);
  if(!accounts || typeof accounts !== "object") return;
  const next = {};
  for(const account of Object.values(accounts)){
   const club = safeChatClub(account && account.club);
   if(account && account.uid && club) next[String(account.uid)] = club;
  }
  chatClubMap = next;
  chatClubsAt = Date.now();
 }catch(_){ /* keep last-good club labels */ }
}
function chatClubFor(message){
 if(gkUser && message && String(message.uid) === String(gkUser.uid)) return safeChatClub(myClub);
 return safeChatClub(message && chatClubMap[String(message.uid)]);
}
function normChat(list){
 const seen = {};
 return (Array.isArray(list) ? list : [])
  .map(m => m && ({...m, kind:m.kind || "text", text:m.text != null ? String(m.text) : String(m.txt || ""), txt:m.text != null ? String(m.text) : String(m.txt || "")}))
  .filter(m => m && m.id && m.uid && (m.text || m.mediaKey) && !seen[m.id] && (seen[m.id] = 1))
  .sort((a, b) => (a.ts || 0) - (b.ts || 0))
  .slice(-200);
}
try{ chatMsgs = normChat(JSON.parse(localStorage.getItem("gk_chat_cache") || "[]")); }catch(_){}
function cacheChat(){ try{ localStorage.setItem("gk_chat_cache", JSON.stringify(chatMsgs.slice(-100))); }catch(_){} }
/* `chatSession` is null until somebody signs in, and this read `chatSession.token`
   unconditionally - which threw a TypeError rather than returning an unauthorized request.
   Chat only ever called it behind a session check so it never showed; moving predictions onto
   the same API put it on a path that does NOT have one, where the throw was swallowed by a
   catch and the tab simply stayed empty. No headers is a 401, which is a thing the caller can
   see and act on; an exception is not. */
function chatAuthHeaders(extra){
 const h = Object.assign({}, extra || {});
 if(chatSession && chatSession.token) h.Authorization = "Bearer " + chatSession.token;
 return h;
}

function addChatMessage(message, notify){
 if(!message || !message.id) return;
 const normalized = normChat([message])[0];
 if(!normalized) return;
 const old = chatMsgs.findIndex(item => item.id === normalized.id);
 if(old >= 0) chatMsgs[old] = Object.assign({}, chatMsgs[old], normalized);
 else chatMsgs.push(normalized);
 chatMsgs = normChat(chatMsgs);
 cacheChat();
 if(notify && gkUser && normalized.uid !== gkUser.uid) showLocalChatNotification(normalized);
 if(mainView === "chat") renderChat();
 updateChatBadge();
}
/* A DEAD SOCKET LOOKS EXACTLY LIKE A QUIET ROOM.
   The WC app polled, so a broken connection healed itself. This app relies entirely on the
   WebSocket, and when a phone switches network or sleeps, the socket dies without an error
   the user can see: the room simply stops receiving, forever, until the app is reloaded.
   A slow poll while the chat tab is open costs almost nothing and removes that failure. */
let _chatPoll = null;
function chatPollStart(){
 clearInterval(_chatPoll);
 _chatPoll = setInterval(function(){
  if(mainView !== "chat" || document.hidden) return;
  const dead = !chatSocket || chatSocket.readyState > 1;   /* CLOSING or CLOSED */
  if(dead){ try{ connectChat(); }catch(_){} loadChatHistoryOnly(); }
 }, 20000);
}
async function loadChatHistoryOnly(){
 if(!validChatSession()) return;
 try{
  const r = await fetch(CHAT_API + "/api/chat/history", {headers: chatAuthHeaders(), cache: "no-store"});
  const j = await r.json().catch(() => ({}));
  if(r.ok && j.ok && Array.isArray(j.messages) && j.messages.length){
   chatMsgs = normChat(j.messages);
   cacheChat();
   if(mainView === "chat") renderChat();
   updateChatBadge();
  }
 }catch(_){}
}
async function loadChat(){
 if(!gkUser){ if(mainView === "chat") renderChat(); updateChatBadge(); return; }
 await renewStoredChatSession();
 if(!validChatSession()){ refreshChatBar(); if(mainView === "chat") renderChat(); updateChatBadge(); return; }
 const clubsReady = loadChatClubs(false);
 connectChat();
 try{
  const r = await fetch(CHAT_API + "/api/chat/history", {headers:chatAuthHeaders(), cache:"no-store"});
  if(r.status === 401){ clearChatSession(); closeChatSocket(); refreshChatBar(); if(mainView === "chat") renderChat(); return; }
  const j = await r.json().catch(() => ({}));
  /* An empty history is only believed when we have nothing cached. chatHistory always answers
     ok:true, so a room migration or storage blip is indistinguishable from "the room is empty" —

/* A PHONE PHOTO IS 3-8 MB AND NOBODY NEEDS THAT IN A CHAT.
   The WC app resized to 1600px and re-encoded at JPEG 0.82 before uploading; this app sent
   the original. On a mobile connection that is a slow upload that often just fails, and the
   8 MB ceiling above rejected perfectly ordinary photos outright — a modern phone camera
   clears it easily. GIFs pass through untouched, because re-encoding one to JPEG throws away
   the animation. */
function compressImage(file){
 return new Promise(function(resolve){
  if(!file.type || file.type === "image/gif" || !/^image\//.test(file.type)) return resolve({blob: file, type: file.type});
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = function(){
   const max = 1600;
   let w = img.width, h = img.height;
   if(w > max || h > max){ const k = Math.min(max / w, max / h); w = Math.round(w * k); h = Math.round(h * k); }
   const c = document.createElement("canvas");
   c.width = w; c.height = h;
   c.getContext("2d").drawImage(img, 0, 0, w, h);
   c.toBlob(function(bl){
    try{ URL.revokeObjectURL(url); }catch(_){}
    /* if the canvas made it BIGGER (already-small or already-optimised images), keep the
       original — compression that inflates a file is not compression */
    resolve(bl && bl.size < file.size ? {blob: bl, type: "image/jpeg"} : {blob: file, type: file.type});
   }, "image/jpeg", 0.82);
  };
  img.onerror = function(){ try{ URL.revokeObjectURL(url); }catch(_){} resolve({blob: file, type: file.type}); };
  img.src = url;
 });
}

/* A VOICE NOTE MUST PLAY ON EVERY PHONE, AND WEBM DOES NOT.
   This recorded with MediaRecorder and preferred "audio/webm;codecs=opus" — which Android
   Chrome produces happily and iOS Safari CANNOT PLAY AT ALL. So an Android voice note was
   silent on every iPhone in the room, and the owner saw exactly that asymmetry.

   The WC app never used MediaRecorder for this. It captures raw PCM through an AudioContext
   and writes the WAV header itself, because WAV is the one container every browser on every
   platform decodes. That is ported here verbatim in behaviour: mono, downsampled to 16 kHz,
   16-bit — about 32 KB a second, which is the price of it working everywhere.

   MediaRecorder is gone rather than kept as a fallback: a fallback that produces a file half
   the room cannot open is not a fallback, it is the bug with extra steps. */
function vnDownsample(buf, from, to){
 if(!from || to >= from) return buf;
 const ratio = from / to, outLen = Math.max(1, Math.round(buf.length / ratio));
 const out = new Float32Array(outLen);
 for(let i = 0; i < outLen; i++){
  const start = Math.floor(i * ratio), end = Math.min(buf.length, Math.floor((i + 1) * ratio));
  let sum = 0, n = 0;
  for(let j = start; j < end; j++){ sum += buf[j]; n++; }
  out[i] = n ? sum / n : 0;
 }
 return out;
}
function vnEncodeWav(samples, rate){
 const n = samples.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
 const wr = (o, str) => { for(let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
 wr(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); wr(8, "WAVE"); wr(12, "fmt ");
 v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
 v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
 v.setUint16(32, 2, true); v.setUint16(34, 16, true);
 wr(36, "data"); v.setUint32(40, n * 2, true);
 let o = 44;
 for(let i = 0; i < n; i++){
  const x = Math.max(-1, Math.min(1, samples[i]));
  v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7FFF, true);
  o += 2;
 }
 return new Blob([buf], {type: "audio/wav"});
}
const VN_RATE = 16000;
let vnCtx = null, vnNode = null, vnParts = [], vnLen = 0;
function vnStop(){
 try{ if(vnNode) vnNode.disconnect(); }catch(_){}
 try{ if(vnCtx) vnCtx.close(); }catch(_){}
 vnNode = null; vnCtx = null;

}
async function toggleVoiceNote(){

  if(!vnNode){ vnStop(); return toastMsg(t("chatVoiceUnsupported")); }
  vnParts = []; vnLen = 0;
  vnNode.onaudioprocess = function(e){
   const ch = e.inputBuffer.getChannelData(0);
   const copy = new Float32Array(ch.length);
   copy.set(ch);
   vnParts.push(copy); vnLen += copy.length;
  };
  source.connect(vnNode);

  voiceStarted = Date.now();

}

/* ============ push notifications (client) ============ */
const GK_VAPID_PUBLIC = "BLyDli3t0W8TTo9gL7s4ibxgVJY6_ism0HIyn8DymerLNs1Bs9mo5ct5i_wti8NNUQ_pfXxMXXZfJKdg1Gc02RM";
const PUSH_SUBS_KEY = "goalak_push_subs";
let pushLgs = [];
try{ pushLgs = JSON.parse(localStorage.getItem("gk_push_lgs") || "[]"); }catch(_){}
function allLgIds(){ return LEAGUES.map(l => l.id).filter((v, i, a) => a.indexOf(v) === i); }
function pushUiState(on){
 const onB = $("pushOnB"), offB = $("pushOffB");
 if(!onB) return;
 onB.classList.toggle("on", !!on);
 offB.classList.toggle("on", !on);
 $("pushLgRow").classList.toggle("hide", !on);
 if(on) renderPushLgs();
}
function renderPushLgs(){
 const seenIds = {}; const uniq = [];
 for(const lg of LEAGUES){ if(!seenIds[lg.id]){ seenIds[lg.id] = 1; uniq.push(lg); } }
 $("pushLgRow").innerHTML = '<span class="shlab">' + esc(t("pushLeagues")) + "</span>" +
  uniq.map(lg => '<button type="button" class="chip' + (!pushLgs.length || pushLgs.includes(lg.id) ? " on" : "") + '" onclick="togglePushLg(\'' + lg.id + '\')">' + esc(lgShort(lg)) + "</button>").join("");
}
function togglePushLg(id){
 const all = allLgIds();
 if(!pushLgs.length) pushLgs = all.slice();
 if(pushLgs.includes(id)){
  /* TEAMS-ONLY IS A REAL MODE NOW. The last league used to be un-turn-off-able, because the
     empty list is overloaded to mean "all leagues" - but somebody following five clubs does
     not want five whole leagues buzzing. With teams picked, the last league may go dark: the
     sentinel "none" is a non-empty list that matches no league, so only team alerts pass. */
  if(pushLgs.length === 1){
   if(!myTeams.length) return toastMsg(t("pushKeepOne"));
   pushLgs = ["none"];
  } else pushLgs = pushLgs.filter(x => x !== id);
 } else pushLgs = pushLgs.filter(x => x !== "none").concat([id]);
 if(pushLgs.length === all.length) pushLgs = [];
 const before = pushLgs.slice();
 renderPushLgs();
 /* THE CHIP USED TO COMMIT BEFORE THE SAVE WAS KNOWN TO HAVE WORKED — localStorage written,
    UI repainted, and then savePushSub() fired and its result thrown away. All three attempts
    could fail and the chip would still read "off" while the server kept sending. */
 savePushSub().then(function(saved){
  if(saved){ try{ localStorage.setItem("gk_push_lgs", JSON.stringify(before)); }catch(_){} return; }
  pushLgs = JSON.parse(localStorage.getItem("gk_push_lgs") || "[]");
  renderPushLgs();
  toastMsg(t("authSaveFail"));
 }).catch(function(){
  pushLgs = JSON.parse(localStorage.getItem("gk_push_lgs") || "[]");
  renderPushLgs();
  toastMsg(t("authSaveFail"));
 });
}
function b64urlKey(s){
 const b64 = s.replace(/-/g, "+").replace(/_/g, "/");
 const pad = b64 + "=".repeat((4 - b64.length % 4) % 4);
 const bin = atob(pad);
 const u = new Uint8Array(bin.length);
 for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
 return u;
}
async function setPush(on){
 if(!on){
  pushUiState(false);
  try{
   const reg = await navigator.serviceWorker.ready;
   const sub = await reg.pushManager.getSubscription();
   if(sub){ const ep = sub.endpoint; await sub.unsubscribe().catch(() => {}); await removePushSub(ep); }
  }catch(_){}
  return;
 }
 if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)){ toastMsg(t("pushUnsupported")); pushUiState(false); return; }
 if(isIOS() && !isStandalone()){ toastMsg(t("pushIosInstall")); pushUiState(false); return; }
 try{
  const perm = await Notification.requestPermission();
  if(perm !== "granted"){ toastMsg(t("pushDenied")); pushUiState(false); return; }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64urlKey(GK_VAPID_PUBLIC) });
  const saved = await savePushSub(sub);
  if(!saved){ try{ await sub.unsubscribe(); }catch(_){} toastMsg(t("authNet")); pushUiState(false); return; }
  pushUiState(true);
  toastMsg(t("pushOnOk"));
 }catch(_){ toastMsg(t("authNet")); pushUiState(false); }
}
function subsSeen(){ try{ return +localStorage.getItem("gk_subs_seen") || 0; }catch(_){ return 0; } }
function subsSeenUpd(n){ try{ if(n > subsSeen()) localStorage.setItem("gk_subs_seen", String(n)); }catch(_){} }
async function savePushSub(subObj){
 /* returns true only when the record is CONFIRMED present without shrinking the shared list (wipe guard, QA finding) */
 try{
  if(!("serviceWorker" in navigator)) return false;
  const reg = await navigator.serviceWorker.ready;
  const sub = subObj || await reg.pushManager.getSubscription();
  if(!sub) return false;
  const j = sub.toJSON();
  const rec = { endpoint:j.endpoint, keys:j.keys, lgs:pushLgs, teams:myTeamIds().slice(0, 10),
                lang:LANG, uid:gkUser ? gkUser.uid : null, name:gkUser ? gkUser.username : null, ts:Date.now() };
  for(let i = 0; i < 3; i++){
   try{
    const listR = await tdbRead(PUSH_SUBS_KEY, null);
    const list = Array.isArray(listR) ? listR : [];
    subsSeenUpd(list.length);
    if(list.length === 0 && subsSeen() > 1){ await sleep(400); continue; } /* suspicious empty read: never write over it */
    const next = list.filter(s => s && s.endpoint !== rec.endpoint);
    next.push(rec);
    await tdbWrite(PUSH_SUBS_KEY, next);
    await sleep(300);
    const chk = await tdbRead(PUSH_SUBS_KEY, null);
    if(Array.isArray(chk) && chk.some(s => s && s.endpoint === rec.endpoint) && chk.length >= next.length){ subsSeenUpd(chk.length); return true; }
   }catch(_){ await sleep(300); }
  }
 }catch(_){}
 return false;
}
async function removePushSub(ep){
 for(let i = 0; i < 3; i++){
  try{
   const listR = await tdbRead(PUSH_SUBS_KEY, null);
   const list = Array.isArray(listR) ? listR : [];
   if(list.length === 0) return; /* nothing to remove; never write an empty list over a failed read */
   subsSeenUpd(list.length);
   const next = list.filter(s => s && s.endpoint !== ep);
   if(next.length === list.length) return;
   await tdbWrite(PUSH_SUBS_KEY, next);
   await sleep(250);
   const chk = await tdbRead(PUSH_SUBS_KEY, null);
   if(Array.isArray(chk) && !chk.some(s => s && s.endpoint === ep) && chk.length >= next.length) return;
  }catch(_){ await sleep(300); }
 }
}
async function refreshPushUI(){
 let on = false;
 try{
  if("serviceWorker" in navigator && "PushManager" in window && "Notification" in window && Notification.permission === "granted"){
   const reg = await navigator.serviceWorker.ready;
   on = !!(await reg.pushManager.getSubscription());
  }
 }catch(_){}
 pushUiState(on);
}

/* ============ refresh loop + lifecycle ============ */
/* At midnight, follow the user onto the new day instead of leaving them on yesterday.
   One helper, called from the tick AND from resume — an installed PWA is backgrounded across
   midnight every single night, so the tick alone would never fire for the normal case. */
function followToday(){
 const tk = todayKey();
 if(stripBuiltFor && stripBuiltFor !== tk && selDay === stripBuiltFor) selectDay(tk);
}
setInterval(function(){
 if(document.hidden) return;
 followToday();
 buildStrip(false); /* day rollover rebuilds the strip */
 /* AN OPEN SHEET ON A LIVE MATCH FOLLOWS THE MATCH. The list behind the sheet repainted
    every 25 seconds while the sheet itself froze at the moment it was opened - score, clock,
    line-ups, substitutions, all of it. This is the second half of the Barcelona fix; the
    staleness rule in ensureSummary is the first. */
 if(_mdEid && !$("modal").classList.contains("hide")){
  const me_ = EV_INDEX[_mdEid];
  if(me_ && evState(me_) === "in"){ try{ renderMatchModal(_mdEid); }catch(_){} }
 }
 if(mainView === "chat") return; /* chat has its own 12s poll */
 loadChat(); /* background room check keeps the unread badge honest */
 if(mainView === "pred"){ loadPredData(false); return; }
 if(view === "home"){
  /* keep refreshing yesterday too: late European kickoffs cross local midnight while still live */
  const tk = todayKey(), yd = addDaysKey(tk, -1);
  if(selDay === tk || selDay === yd) loadDay(false);
  /* whatever day is on screen, keep TODAY and YESTERDAY warm so the live strip/chip never
     goes blank right after midnight while a match is still being played */
  const others = [tk, yd].filter(d => d !== selDay);
  /* broadcasts too, or a match that crossed midnight loses its TV channel in the sheet */
  /* the cup feed is kept warm here too, or a Super Cup that kicked off at 22:00 local drops out of
     the live strip the moment the date rolls over — the v2.66 lesson, applied to the new group.
     buildTopClubsBucket is chained per day so it still runs AFTER that day's league fetch. */
  if(others.length) Promise.all(others.map(d => Promise.all([fetchDayInto(d, false), fetchBroadcastInto(d, false), fetchTopClubsInto(d, false)])
    .then(function(){ try{ buildTopClubsBucket(d); }catch(_){} })))
   .then(function(){ if(view === "home" && mainView === "scores"){ renderLiveStrip(); paintHome(); } });
 }
 else if(view === "lg"){
  if(lgTab === "M") renderLgMatches();
  /* a manager parked on the TABLE after full time deserves the new standings without
     re-entering the tab; renderTable throttles itself to one fetch per two minutes */
  else if(lgTab === "T") renderTable();
 }
}, 25000);
document.addEventListener("visibilitychange", function(){
 if(document.hidden) return;
 followToday();          /* resumed after midnight: move to today before anything repaints */
 /* a PC left open on the predictions tab learns of picks made on the phone the moment it is
    looked at again, not on the next tab re-entry */
 if(mainView === "pred"){ syncMyPreds(); loadPredData(false); }
 /* the OS permission can be revoked while the app is in the background, and the switch went
    on reading ON until a full reload */
 try{ refreshPushUI(); }catch(_){}
 buildStrip(false);
 if(gkUser && validChatSession()){ connectChat(); loadChat(); }
 if(mainView === "pred"){ loadPredData(false); return; }
 if(view === "home") loadDay(false);
 else paintLeague();
});

/* Last-resort anti-stale guard: ask the network what the current build is and reload once if this
   client is running an older one. Independent of the service worker, so it still rescues an app
   that got stuck for any reason. Guarded per version so it can never loop. */
let _vCheckBusy = false;
async function gkVersionCheck(){
 if(_vCheckBusy || document.hidden) return;
 _vCheckBusy = true;
 try{
  const r = await fetch("index.html?v=" + Date.now(), {cache:"no-store"});
  if(!r.ok) return;
  const txt = await r.text();
  const m = txt.match(/const APP_VERSION = "([\d.]+)"/);
  if(!m || m[1] === APP_VERSION) return;
  let done = "";
  try{ done = sessionStorage.getItem("gk_vreload") || ""; }catch(_){}
  if(done === m[1]) return;                       /* already reloaded for this build this session */
  try{ sessionStorage.setItem("gk_vreload", m[1]); }catch(_){}
  location.reload();
 }catch(_){ /* offline: keep running the cached build */ }
 finally{ _vCheckBusy = false; }
}

/* ============ boot ============ */
(function(){
 document.documentElement.lang = LANG;
 document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
 $("lgEn").classList.toggle("on", LANG === "en");
 $("lgAr").classList.toggle("on", LANG === "ar");
 refreshBrandUI();
 $("motto").textContent = t("motto");
 $("footMotto").textContent = t("motto");
 $("loadTxt").textContent = t("loading");
 setTheme(THEME);
 refreshSettingsUI();
 tickClock();
 setInterval(tickClock, 1000);
 buildRail();
 buildStrip(true);
 paintNavLabels();
 refreshChatNote();
 refreshChatBar();
 trackVisit();   /* the chat bar shipped hardcoded strings until it was first opened */
 /* RE-PUBLISH THE SUBSCRIPTION ON EVERY OPEN. Nothing did: the record was written at subscribe,
    at sign-in, at sign-out, on a language change and on a league chip, and never otherwise. So a
    push service that rotated the endpoint left a dead record on the server while Settings still
    read ON - and the same for a uid or language that changed some other way. It is one cheap
    write against a record we already hold, and it is the only thing that heals a stale one. */
 setTimeout(function(){ try{ if(Notification && Notification.permission === "granted") savePushSub(); }catch(_){} }, 4000);
 /* THE ACCOUNT IS RE-READ ON EVERY OPEN. acctInfoEnsure deliberately re-asks only while the
    account is UNSETTLED (its subject is the email nudge) - which meant a settled account
    never heard about anything changed from another device: the owner picked ten teams on
    the PC and his phone kept showing none, for ever. One "me" per open; the response carries
    the club and the teams and acctInfoStore adopts whatever differs. */
 if(gkUser && validChatSession()){
  apiAuthAuthed("me").then(function(res){ if(res.ok) acctInfoStore(res.j.user); }).catch(function(){});
 }
 maybeTeamsPromo();
 loadDay(false);
 syncMyPreds();
 refreshPushUI();
 loadChat();
 /* deep link: ?lg=<leagueId> opens that league, ?go=pred opens predictions */
 try{
  const q = new URLSearchParams(location.search);
  /* THE LINKS THE WORKER SENDS HAD TO GO SOMEWHERE. It has mailed
     goallak.com/?reset=<token> and ?verify=<token> since the account store was built, and this
     handler read only `lg` and `go` — so both landed on the Matches tab and did nothing, which
     is why "forgot my password" was a dead end however well the server behaved. */
  const rq = q.get("reset");
  if(rq){ openReset(rq); return; }
  const vq = q.get("verify");
  if(vq){ doVerify(vq); return; }
  const lgq = q.get("lg");
  if(q.get("go") === "pred") showMain("pred");
  else if(q.get("go") === "fant") goFantasy();
  else if(q.get("go") === "chat") showMain("chat");
  else if(lgq && LEAGUES.some(l => l.id === lgq)) gotoLeague(lgq);
 }catch(_){}
 if("serviceWorker" in navigator){
  /* One-time hard refresh gated by FORCE_RELOAD: a new SW (skipWaiting + claim) fires controllerchange
     on already-open clients; reload ONCE per token, then remember it. Normal deploys never reload an
     open session, and a first-ever visit never reloads. */
  let _swReloaded = false;
  const _hadController = !!navigator.serviceWorker.controller;
  /* a home-screen app that is only resumed never navigates, so nothing would ever check for a new
     build. Ask for an update on every resume (and periodically while open). */
  window.gkSWReg = null;
  const gkCheckUpdate = function(){
   try{ if(window.gkSWReg) window.gkSWReg.update().catch(function(){}); }catch(_){}
   gkVersionCheck();
  };
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) gkCheckUpdate(); });
  window.addEventListener("focus", gkCheckUpdate);
  setInterval(gkCheckUpdate, 300000);
  /* THE SERVICE WORKER RE-SUBSCRIBED AND NOTHING WAS LISTENING.
     A push service can rotate an endpoint out from under the app with no user-visible event:
     the old one starts returning 410, the worker prunes it, and the person is silently
     unsubscribed with the switch in Settings still reading ON. sw.js now re-subscribes and
     posts the new record here - but a message nobody receives is half a fix, so the page has
     to be the half that saves it and drops the dead endpoint. */
  navigator.serviceWorker.addEventListener("message", function(e){
   const d = e && e.data;
   if(!d || d.gk !== "pushsub" || !d.sub || !d.sub.endpoint) return;
   savePushSub({toJSON: function(){ return d.sub; }}).then(function(saved){
    if(saved && d.old && d.old !== d.sub.endpoint){ try{ removePushSub(d.old); }catch(_){} }
    try{ refreshPushUI(); }catch(_){}
   }).catch(function(){});
  });
  navigator.serviceWorker.addEventListener("controllerchange", function(){
   if(_swReloaded || !_hadController) return;
   try{ if(localStorage.getItem("gk_reload_token") === FORCE_RELOAD) return; }catch(_){}
   try{ localStorage.setItem("gk_reload_token", FORCE_RELOAD); }catch(_){}
   _swReloaded = true;
   location.reload();
  });
  /* updateViaCache:"none" — GitHub Pages serves sw.js with max-age=600, so without this the browser
     hands back a CACHED worker on update checks and a stale app never learns a new build exists. */
  try{
   navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(function(reg){
    if(!reg) return;
    window.gkSWReg = reg;
    reg.update().catch(function(){});
   }).catch(function(){ try{ navigator.serviceWorker.register("sw.js"); }catch(__){} });
  }catch(_){}
 }
})();
