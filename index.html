<script>
/* BEFORE ANYTHING PAINTS. The document is hardcoded Arabic/RTL and the palette is dark, and
   both were only corrected at the very END of a 300KB single-file script - so an English
   reader watched the whole page flip from Arabic RTL on every single load, and anybody on the
   light theme got a dark flash first. Four lines at the top of the head, ahead of the fonts
   and ahead of the body, and neither flash can happen. */
(function(){
 try{
  var l = localStorage.getItem("gk_lang");
  if(l === "en" || l === "ar"){
   document.documentElement.lang = l;
   document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  }
  var t = localStorage.getItem("gk_theme");
  if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
 }catch(_){}
})();
</script>

<style>
:root{
 /* WCup family palette (same navy/rust/gold as the World Cup app) */
 --bg:#0a1230; --card:#121d44; --card2:#0e1736; --line:#22305f; --line2:#2e4076;
 --txt:#eef2ff; --dim:#8493c8; --dim2:#8493c8;
 --acc:#ff7a45; --accdark:#7e2f12; --gold:#ffc02e; --red:#ff5d5d;
 --rz-g:#2fd873; --rz-a:#ffc02e; --rz-r:#ff5d5d;
 /* 3D icon depth ramp */
 --gk3d-d1:#b3bfec; --gk3d-d2:#8493c8; --gk3d-d3:#4a5687;
 --gk3d-d4:#2f3a63; --gk3d-d5:#1b2342; --gk3d-rim:rgba(255,255,255,.22);
}
/* inline 3D accent icons replacing emoji (emoji render differently per platform — same reason the
   country flags had to become images) */
.gkic{width:1.05em;height:1.05em;display:inline-block;vertical-align:-.16em;flex:none}
.bnav .gka{display:none}
.bnav button.on .gki{display:none}
.bnav button.on .gka{display:inline}
/* light theme (same family as the WC app light mode) */
html[data-theme="light"]{
 --gk3d-d1:#8e9bc6; --gk3d-d2:#57648a; --gk3d-d3:#2e3a58;
 --gk3d-d4:#1c2540; --gk3d-d5:#0e1424; --gk3d-rim:rgba(18,29,68,.32);
 --bg:#eef1f8; --card:#ffffff; --card2:#e6ebf6; --line:#c3cde2; --line2:#9fb0d4;
 /* Light is the DEFAULT theme because it is the readable one for older eyes, so every token here
    must clear WCAG AA (4.5:1) against the WORST ground it can land on - #ffffff card, #eef1f8 page
    AND #e6ebf6 card2. Measured, not guessed:
      --acc  #b03f18  5.20 / 5.88 / 4.92   (was #c2451b: 4.46 / 5.05 / 4.22 - failed on two of three)
      --dim2 #5c6a89  4.79 / 5.42 / 4.53   (was #6b7a9c: 3.80 / 4.30 / 3.60 - failed on all three)
      --gold #8a5d00  4.94 / 5.59 / 4.82   (was #946400: 4.55 / 5.14 / 4.31 - failed on card2) */
 --txt:#0d1533; --dim:#51607e; --dim2:#5c6a89;
 --acc:#b03f18; --accdark:#b03f18; --gold:#8a5d00; --red:#c62828;
 --rz-g:#0f9d58; --rz-a:#a67c00; --rz-r:#c62828;
}
html[data-theme="light"] .stale{background:#fff3d6;border-color:#d9b64a;color:#7a5d00}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--txt);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{max-width:100%}
.hide{display:none!important}
#app{max-width:680px;margin:0 auto;padding:0 10px 40px;position:relative}

/* ---------- header ---------- */
.gkhead{display:flex;align-items:center;gap:10px;padding:14px 2px 10px}
/* brand tile stays Midnight Aubergine in BOTH themes (it is the app icon) */
.gklogo{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:linear-gradient(135deg,#2c1a40,#211235);display:flex;align-items:center;justify-content:center;border:1px solid var(--line2)}
.gklogo img{width:34px;height:34px;display:block}
.gktit{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.gkname{font-family:'Alexandria','Cairo',system-ui,sans-serif;font-weight:800;font-size:21px;letter-spacing:.5px;line-height:1.15;color:var(--txt);white-space:nowrap}
.gkname b{color:var(--acc)}
.gkmotto{font-size:12.5px;color:var(--gold);font-weight:700;line-height:1.3}
.gkspacer{flex:1}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{padding:5px 12px;font-size:12px;font-weight:700;color:var(--dim)}
.seg button.on{background:var(--accdark);color:#fff}
.themebtn{padding:7px 9px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--dim);display:flex;align-items:center}
.themebtn svg{width:17px;height:17px}
html[data-theme="dark"] .ico-moon{display:none}
html[data-theme="light"] .ico-sun{display:none}
.setchip{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--dim);font-size:11.5px;font-weight:700}

/* ---------- settings sheet (WC-app style dropdown dialog) ---------- */
/* settings is a full PAGE in the bottom nav now (not a dropdown) */
.sheet{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:0 14px 6px;margin-bottom:10px}
.shtop{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.shttl{font-size:13px;font-weight:900;letter-spacing:.4px}
.shx{width:26px;height:26px;border-radius:50%;background:var(--card2);color:var(--dim);font-size:14px;line-height:1}
.shrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.shrow:last-of-type{border-bottom:none}
.shlab{font-size:13px;font-weight:700;color:var(--dim)}
.sheet select{background:var(--card2);color:var(--txt);border:1px solid var(--line2);border-radius:9px;padding:6px 10px;font-family:inherit;font-size:12.5px;font-weight:700;max-width:58%}
.shver{text-align:center;font-size:10px;color:var(--dim2);padding:8px 0 6px;letter-spacing:.5px;font-weight:700}
.shinstall{display:flex;width:100%;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:800;color:var(--acc);text-align:start}
.pushlgs{flex-wrap:wrap;justify-content:flex-start;gap:6px}
.pushlgs .shlab{flex-basis:100%}
.pushlgs .chip{padding:4px 11px;font-size:12px}

/* ---------- info bar (status dot + tz + clock, like the WC connbar) ---------- */
.infobar{display:flex;align-items:center;gap:8px;padding:2px 6px 8px;font-size:10.5px;color:var(--dim2);font-weight:700;letter-spacing:.3px}
.condot{width:7px;height:7px;border-radius:50%;background:var(--rz-g);flex:0 0 auto}
.condot.bad{background:var(--gold)}
.ibr{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.cz{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1px 8px;font-size:10px;font-weight:800}
.cz--off{color:var(--dim2)}
.clock{font-weight:900;color:var(--txt);font-size:12px;font-variant-numeric:tabular-nums}

/* ---------- league rail: 9 chips in two tidy rows, no scrolling ---------- */
.rail{position:sticky;top:0;z-index:40;background:linear-gradient(var(--bg) 85%,transparent);padding:6px 0 8px;display:flex;flex-wrap:wrap;gap:5px}
.railc{flex:1 1 calc(20% - 5px);min-width:calc(20% - 5px);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--dim)}
.railc.on{background:var(--accdark);border-color:var(--acc);color:#fff}
.railc .rico{font-size:16px;line-height:1.15}
.rflag{width:20px;height:14px;border-radius:2.5px;object-fit:cover;display:inline-block;vertical-align:middle;border:1px solid rgba(255,255,255,.12)}
.railc .rflag{margin:1px 0}
.lgphead .rflag{width:26px;height:18px}
.railc .rlbl{font-size:8.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ---------- date strip ---------- */
.dwrap{margin:2px 0 8px}
.dstrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.dstrip::-webkit-scrollbar{display:none}
.dc{flex:0 0 auto;width:52px;padding:6px 0 5px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:0}
.dc .wd{font-size:9.5px;letter-spacing:1px;color:var(--dim2);font-weight:700}
.dc .dn{font-size:17px;font-weight:800;line-height:1.2}
.dc .mo{font-size:10px;color:var(--dim)}
.dc.sel{background:var(--accdark);border-color:var(--acc)}
.dc.sel .wd,.dc.sel .mo{color:#ffd9c7}
.dc.tdy .dn{color:var(--gold)}
.dc.sel.tdy .dn{color:#fff}

/* ---------- counter + chips ---------- */
.cnt{font-size:12px;color:var(--dim);padding:0 4px 8px;font-weight:600}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:5px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap}
.chip.on{background:var(--accdark);border-color:var(--acc);color:#fff}
.chip.lv{color:var(--red)}
.chip.lv.on{background:#5b1717;border-color:var(--red);color:#fff}
.chip .cn{opacity:.75;font-size:11px}

/* ---------- stale / error ---------- */
.stale{display:flex;align-items:center;gap:8px;background:#2b2413;border:1px solid #57491f;color:var(--gold);border-radius:10px;padding:7px 12px;font-size:12px;font-weight:600;margin:0 0 10px}
.errbox{text-align:center;padding:40px 10px;color:var(--dim)}
.errbox .big{font-size:34px;margin-bottom:8px}
.retrybtn{margin-top:12px;padding:8px 22px;border-radius:10px;background:var(--accdark);color:#fff;font-weight:700;font-size:13px}

/* ---------- league sections (home) ---------- */
.lgsec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.lghead{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.lgopen{flex:1;display:flex;align-items:center;gap:9px;padding:10px 13px;min-width:0;text-align:start}
.lgopen.allonly{cursor:default}
.lgico{font-size:16px;flex:0 0 auto}
.lgnm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgn{font-size:11px;color:var(--dim);background:var(--card2);border-radius:10px;padding:1px 8px;font-weight:700;flex:0 0 auto}
.lgarrow{color:var(--dim2);font-size:17px;font-weight:800;margin-inline-start:auto;flex:0 0 auto}
[dir=rtl] .lgarrow{transform:scaleX(-1)}
.fold{padding:10px 14px;color:var(--dim2);font-size:16px;font-weight:800;border-inline-start:1px solid var(--line)}

/* ---------- match rows ---------- */
.mrow{display:grid;grid-template-columns:1fr 112px 1fr;align-items:center;width:100%;padding:9px 10px;border-bottom:1px solid var(--line);gap:4px;text-align:center}
.mrow:last-child{border-bottom:none}
.mrow:active{background:var(--card2)}
.tm{display:flex;align-items:center;gap:7px;min-width:0}
.tmh{justify-content:flex-end;text-align:end}
.tma{justify-content:flex-start;text-align:start}
.tm i{font-style:normal;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crest{width:22px;height:22px;object-fit:contain;flex:0 0 auto}
.crestfb{width:22px;height:22px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);color:var(--dim);font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;letter-spacing:.3px}
.mid{display:flex;flex-direction:column;align-items:center;gap:1px}
.mtime{font-size:13.5px;font-weight:800;color:var(--txt)}
.msc{font-size:16px;font-weight:900;letter-spacing:1px}
.msc.live{color:var(--red)}
.msub{font-size:9.5px;color:var(--dim2);font-weight:700;letter-spacing:.4px}
.msub .lvm{color:var(--red)}
.tvch{display:block;max-width:110px;margin:2px auto 0;color:var(--gold);font-size:9.5px;font-weight:800;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvch.unconfirmed{color:var(--dim2);font-weight:700}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.lvdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite;vertical-align:middle;margin-inline-end:3px}

/* ---------- league page ---------- */
.lgphead{display:flex;align-items:center;gap:10px;padding:4px 2px 10px}
.lgphead .backbtn{padding:6px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:800;color:var(--dim)}
.backbtn span{display:inline-block}
[dir=ltr] .backbtn span{transform:scaleX(-1)}
.lgptit{font-size:17px;font-weight:900}
.lgpico{font-size:19px}
.ltabs{display:flex;gap:7px;padding:0 2px 12px}
.ltab{flex:1;padding:8px 0;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--dim)}
.ltab.on{background:var(--accdark);border-color:var(--acc);color:#fff}
.lseg{display:flex;gap:7px;padding:0 2px 12px}
.lsegb{padding:6px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--dim)}
.lsegb.on{background:var(--card2);border-color:var(--acc);color:#fff}
.dhead{font-size:12px;font-weight:800;color:var(--dim);padding:12px 6px 6px;letter-spacing:.3px}

/* ---------- standings table ---------- */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.trow{display:grid;grid-template-columns:30px 1fr 30px 26px 26px 26px 40px 40px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--line);font-size:12.5px}
.tgf,.tga{display:none}
@media(min-width:430px){
 .trow{grid-template-columns:30px 1fr 30px 26px 26px 26px 30px 30px 40px 40px}
 .tgf,.tga{display:block;text-align:center;color:var(--dim)}
}
.trow:last-child{border-bottom:none}
.trow.thead{color:var(--dim2);font-size:10.5px;font-weight:800;letter-spacing:.4px;background:var(--card2)}
.tpos{text-align:center;font-weight:800;position:relative}
.tpos::before{content:"";position:absolute;inset-block:4px;inset-inline-start:-8px;width:3px;border-radius:2px}
.zg .tpos::before{background:var(--rz-g)}
.za .tpos::before{background:var(--rz-a)}
.zr .tpos::before{background:var(--rz-r)}
.ttm{display:flex;align-items:center;gap:7px;min-width:0;font-weight:700}
.ttm i{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.tnum{text-align:center;color:var(--dim)}
.tpts{text-align:center;font-weight:900;color:#fff}
.tgd{text-align:center;color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:10px 6px;font-size:11px;color:var(--dim);font-weight:600}
.legend .zdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}
.seasonnote{font-size:11.5px;color:var(--gold);padding:8px 6px 0;font-weight:600}

/* ---------- stats ---------- */
.htiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.htile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px 26px;position:relative;overflow:hidden}
.htile::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--hacc,var(--gold))}
.htile .hcap{font-size:10px;color:var(--dim2);font-weight:800;letter-spacing:.5px}
.htile .hname{font-size:13.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htile .hteam{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htile .hnum{position:absolute;inset-inline-end:12px;bottom:4px;font-size:26px;font-weight:900;color:var(--hacc,var(--gold))}
.statcard{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.stath{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:900;font-size:14px}
.stath .ic{font-size:16px}
.srow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.srank{width:22px;text-align:center;font-weight:800;color:var(--dim);font-size:12px;flex:0 0 auto}
.srank.top{color:var(--gold)}
.sname{flex:1;min-width:0}
.sname b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sname span{display:block;font-size:10.5px;color:var(--dim2)}
.sval{font-size:18px;font-weight:900;color:var(--gold);flex:0 0 auto}
.morebtn{width:100%;padding:9px 0;font-size:12px;font-weight:700;color:var(--dim);background:var(--card2)}

/* ---------- modal ---------- */
#modal,#tmfx,#promo{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:520px){#modal,#tmfx,#promo{align-items:center}}
.pmin{text-align:center;padding:8px 6px 4px}
.pmoji{font-size:40px;line-height:1;margin-bottom:8px}
.pmin h2{font-size:18px;font-weight:900;margin:0 0 8px}
.pmin p{font-size:13.5px;line-height:1.9;color:var(--dim);margin:0 0 14px}
.pmgo{display:block;width:100%;padding:12px;border-radius:12px;background:var(--accdark);border:1px solid var(--acc);color:#fff;font-size:14px;font-weight:900}
.pmlater{display:block;width:100%;margin-top:8px;padding:9px;border-radius:10px;background:none;border:none;color:var(--dim);font-size:12.5px;font-weight:700}
.tmadd{display:flex;gap:6px;align-items:center;min-width:0}
.tmadd select{min-width:0;max-width:180px}
.tmchips{display:flex;flex-wrap:wrap;gap:6px}
.tmchips:empty{display:none}
.tmchip{display:inline-flex;align-items:center;gap:2px;padding-block:0}
.tmchip .tmo{padding:6px 2px 6px 6px;font:inherit;color:inherit}
.tmchip .x{padding:6px 8px;min-width:28px;opacity:.75;font-weight:900;font:inherit;color:inherit}
.tmstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.tmstrip:empty{display:none}
.tmstrip .chip{flex:0 0 auto}
.tmnote{font-size:11px;color:var(--dim);line-height:1.7;width:100%}
#tmfxBox .dhead{font-size:14.5px;font-weight:900;color:var(--txt)}
.tmfxrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-block-end:1px solid var(--line)}
.tmfxrow:last-child{border-block-end:none}
.tmfxrow .crest,.tmfxrow .crestfb{width:32px;height:32px;flex:0 0 32px}
.tmfxrow .tfo{flex:1;min-width:0;font-weight:900;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmfxrow .tft{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tmfxrow .tft .msub{font-size:10.5px;color:var(--dim)}
/* ---------- match detail tabs (summary / line-ups / stats) ---------- */
/* z-index 30 + opaque background: the pitch chips (z2) and rating badges (z4) used to paint
   straight over this bar while scrolling the sheet (owner screenshot) */
.mdtabs{display:flex;gap:6px;padding:10px 0 6px;position:sticky;top:-1px;background:var(--card);z-index:30;box-shadow:0 6px 10px -6px rgba(0,0,0,.55)}
.mdtab{flex:1;padding:8px 0;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--dim)}
.mdtab.on{background:var(--accdark);border-color:var(--acc);color:#fff}
.mdload{text-align:center;padding:26px 0;color:var(--dim2);font-size:13px}
.motm{display:flex;align-items:center;gap:10px;width:100%;background:linear-gradient(150deg,#3a2a07,#241a06);border:1px solid var(--gold);border-radius:12px;padding:9px 13px;margin:10px 0 4px;text-align:start}
.motm.loading{opacity:.85}
.motm .mic{font-size:20px;flex:0 0 auto}
.motm .mjer{width:42px;height:42px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
/* player card */
#playerCard{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:110;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:520px){#playerCard{align-items:center}}
.pcbox{max-height:70vh}
.pchead{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.pcjer{width:64px;height:64px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.pcid{flex:1;min-width:0}
.pcid b{display:block;font-size:16px;font-weight:900}
.pcid span{display:block;font-size:12px;color:var(--dim)}
.pcrate{flex:0 0 auto;font-size:17px;font-weight:900;color:#0d1533;border-radius:8px;padding:3px 10px}
.pcrate.rhi{background:#37d27f}.pcrate.rmd{background:#9fd957}.pcrate.rok{background:#e8c552}.pcrate.rlo{background:#dd8a55}
.pcstats{border-top:1px solid var(--line)}
.pcrow{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.pcrow:last-child{border-bottom:none}
.pcrow span{color:var(--dim);font-weight:700}
.pcrow b{font-weight:900}
/* these two classes are declared in the pitch/line-up section above; extend them there, not here,
   so we never repeat the .msg collision that bit the WC app twice */
.motm .mnm{flex:1;min-width:0}
.motm .mnm b{display:block;font-size:14.5px;font-weight:900;color:#ffe9b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.motm .msb{display:block;font-size:11px;color:#c9a44a;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.motm .mrt{flex:0 0 auto;font-size:15px;font-weight:900;color:#241a06;background:linear-gradient(160deg,#ffd86b,#e6b03a);padding:1px 8px;border-radius:7px}
.motm .mtag{flex:0 0 auto;font-size:8.5px;letter-spacing:1px;color:#c9a44a;line-height:1.2;font-weight:800;text-align:end}
.motmtop{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:2px 2px 8px;font-size:11px;color:var(--dim2);font-weight:700}
.motmtop .mtclose{color:var(--gold)}
.motmtop .mtchip{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:2px 8px;color:var(--dim)}
.motmtop .mtchip b{color:var(--gold)}
.rchip{flex:0 0 auto;font-size:10.5px;font-weight:900;border-radius:6px;padding:1px 5px;color:#0d1533}
.rchip.rhi{background:#43d18a}.rchip.rmd{background:#9ad06a}.rchip.rok{background:#e0c05a}.rchip.rlo{background:#d98a7a}
html[data-theme="light"] .motm{background:linear-gradient(150deg,#fff3d6,#ffe9b8);border-color:#c79a1e}
html[data-theme="light"] .motm .mnm b{color:#4a3708}
html[data-theme="light"] .motm .msb,html[data-theme="light"] .motm .mtag{color:#7a5d00}
/* ---- pitch / formation ---- */
.flabel{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:var(--dim);margin:10px 2px 6px}
.flabel span{display:flex;align-items:center;gap:6px;min-width:0}
.flabel b{color:var(--txt);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flabel .crest,.flabel .crestfb{width:18px;height:18px}
/* isolate: keeps every chip/badge z-index INSIDE the pitch so nothing can climb over the tab bar */
.pitch{position:relative;z-index:0;isolation:isolate;width:100%;padding-bottom:150%;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(0deg,#137a3f 0,#137a3f 10%,#12723b 10%,#12723b 20%)}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.pchip{position:absolute;transform:translate(-50%,-50%);width:19%;text-align:center;z-index:2;background:none;border:none;padding:0;cursor:pointer}
.pnum{width:26px;height:26px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff;border:1.5px solid rgba(255,255,255,.75);box-shadow:0 1px 3px rgba(0,0,0,.5)}
.gkPname{display:block;font-size:8.5px;color:#fff;margin-top:2px;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.95);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gkPname .pic{font-size:7.5px;letter-spacing:-1px}
.prate{position:absolute;top:-7px;inset-inline-start:58%;min-width:19px;height:15px;border-radius:4px;font-weight:900;font-size:9.5px;color:#0d1533;display:flex;align-items:center;justify-content:center;padding:0 2px;z-index:4;box-shadow:0 1px 2px rgba(0,0,0,.6)}
.prate.rhi{background:#37d27f}.prate.rmd{background:#9fd957}.prate.rok{background:#e8c552}.prate.rlo{background:#dd8a55}
.lnform{display:flex;justify-content:space-between;gap:8px;padding:10px 2px 8px;font-size:12px;font-weight:800;color:var(--gold)}
.lnform span{max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* min-width:0 lets grid children actually shrink; on phones the two subs lists stack instead of
   spilling past the sheet edge (owner screenshot showed "SUB" clipped off-screen) */
.lncols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lncols>div{min-width:0;overflow:hidden}
@media(max-width:430px){.lncols{grid-template-columns:1fr;gap:2px}}
.lnhead{font-size:11px;font-weight:800;color:var(--dim2);padding:8px 2px 4px;letter-spacing:.3px}
.lnrow{display:flex;align-items:center;gap:6px;padding:4px 2px;font-size:12.5px;border-bottom:1px solid var(--line);min-width:0;overflow:hidden;cursor:pointer}
.lnrow:last-child{border-bottom:none}
.lnnum{flex:0 0 20px;text-align:center;font-size:10.5px;font-weight:900;color:var(--dim2)}
.lnname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.lnpos{flex:0 0 auto;font-size:9.5px;color:var(--dim2);font-weight:800}
.lnic{flex:0 0 auto;font-size:11px;letter-spacing:1px}
/* ---- two-sided timeline (WC-app design) ---- */
.tl{position:relative;margin:4px 0 2px;padding:2px 0}
/* direction-neutral centring (no physical left + translate, which has to be reasoned about per dir) */
.tl::before{content:'';position:absolute;inset-inline:0;margin-inline:auto;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,var(--line2) 10%,var(--line2) 90%,transparent);z-index:0}
.tlrow{position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:5px 0}
.tlrow.goal.l{background:linear-gradient(90deg,rgba(224,90,43,.18),transparent 62%);border-radius:8px}
.tlrow.goal.r{background:linear-gradient(270deg,rgba(21,119,196,.18),transparent 62%);border-radius:8px}
.tlside{flex:1;font-size:12.5px;color:var(--txt);min-width:0;line-height:1.35}
.tlside.l{text-align:right}
.tlside.r{text-align:left}
.tlside b{font-weight:800}
.tlside .tlas{display:block;font-size:10.5px;color:var(--dim2);font-weight:700}
.tlside .si{color:var(--rz-g)}
.tlside .subo{color:var(--dim2);font-size:11px}
.tlrow .ev{display:inline-block;margin:0 5px;font-size:12px}
.tlmin{flex:0 0 46px;text-align:center;font-size:11px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}
.tlmin small{display:block;font-size:10px;color:var(--gold);font-weight:900}
.tlmark{text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--dim2);background:var(--card);position:relative;z-index:1;padding:3px 0}
.tlmark.top{color:var(--gold)}
/* RTL: the flex row mirrors, so mirror the goal highlight + text alignment with it */
html[dir="rtl"] .tlrow.goal.l{background:linear-gradient(270deg,rgba(224,90,43,.18),transparent 62%)}
html[dir="rtl"] .tlrow.goal.r{background:linear-gradient(90deg,rgba(21,119,196,.18),transparent 62%)}
html[dir="rtl"] .tlside.l{text-align:left}
html[dir="rtl"] .tlside.r{text-align:right}
.sclist{display:block;margin-top:4px}
.scln{display:block;font-size:10.5px;color:var(--dim);font-weight:700;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stwrap{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-top:10px}
.stline{padding:10px 2px;border-bottom:1px solid var(--line)}
.stline:last-child{border-bottom:none}
/* fixed side columns so every number lines up down the page */
.sttop{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;font-size:14px;font-weight:900;padding-bottom:6px}
.sttop b:first-child{text-align:start}
.sttop b:last-child{text-align:end}
.sttop .stlab{color:var(--dim);font-size:11.5px;font-weight:700;text-align:center}
.stbar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--card2)}
.stbar i{display:block;height:100%}
.stbar .sh{background:var(--acc)}
.stbar .sa{background:var(--dim2)}
/* overscroll-behavior:contain stops the scroll from chaining into the page behind the sheet
   (owner: "when I scroll down it sometimes scrolls the main page with me") */
.mbox{background:var(--card);border:1px solid var(--line2);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:82vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 16px 26px}
#modal,#tmfx,#promo,#playerCard,#authModal{overscroll-behavior:contain;touch-action:none}
.mbox{touch-action:pan-y}
/* while a sheet is open the page underneath must not move at all */
body.gk-lock{overflow:hidden}
@media(min-width:520px){.mbox{border-radius:18px}}
.mx{position:sticky;top:0;z-index:40;float:inline-end;background:var(--card2);border-radius:50%;width:30px;height:30px;font-size:15px;color:var(--dim)}
.mvs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 0 4px}
.mvt{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.mvt img,.mvt .crestfb{width:44px;height:44px}
.mvt i{font-style:normal;font-size:12.5px;font-weight:800;text-align:center}
.mvsc{font-size:30px;font-weight:900;letter-spacing:2px}
.mvsc.live{color:var(--red)}
.mmeta{text-align:center;font-size:11.5px;color:var(--dim);padding:2px 0 12px;font-weight:600}
.tvmeta{display:inline-block;margin-top:5px;color:var(--gold);font-weight:800}
.tvsource{display:inline-block;margin-inline-start:5px;color:var(--acc);font-weight:800;text-decoration:none}
.evline{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:12.5px;border-bottom:1px solid var(--line)}
.evline:last-child{border-bottom:none}
.evmin{width:44px;color:var(--dim);font-weight:800;font-size:11px;flex:0 0 auto;text-align:center}
.evico{flex:0 0 auto}
.evtxt{font-weight:700}
.evside{margin-inline-start:auto;font-size:10px;color:var(--dim2);font-weight:700}
.mnoev{text-align:center;color:var(--dim2);font-size:12px;padding:14px 0}

/* ---------- misc ---------- */
.empty{text-align:center;color:var(--dim);padding:44px 10px}
.empty .big{font-size:36px;margin-bottom:10px}
footer{text-align:center;font-size:10.5px;color:var(--dim2);padding:26px 0 10px;letter-spacing:.4px;font-weight:600}
footer b{color:var(--dim)}
.skel{padding:30px 0;text-align:center;color:var(--dim2);font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-inline-end:8px}

/* light theme: darker secondary text so small labels stay crisp on white */
html[data-theme="light"]{--dim:#44536f;--dim2:#5a6a8e}

/* ---------- bottom nav (3D bar: gradient body, gold hairline, raised glowing orb on the active tab) ---------- */
#app{padding-bottom:104px}
.bnav{position:fixed;bottom:0;inset-inline:0;max-width:680px;margin-inline:auto;z-index:60;display:flex;background:linear-gradient(180deg,#182553 0%,#141f4a 8%,#0c1434 100%);background-color:#0e1736;border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -10px 28px rgba(0,0,0,.5)}
.bnav::before{content:"";position:absolute;top:-1px;inset-inline:0;height:2px;background:linear-gradient(90deg,transparent 8%,var(--gold) 50%,transparent 92%);opacity:.55;pointer-events:none}
.bnav button{flex:1;padding:10px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--dim2);transition:color .22s;min-width:0}
.bnav button.on{color:var(--gold)}
.bnic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .22s,box-shadow .22s,background .22s;color:inherit}
.bnic svg{width:20px;height:20px}
.bnav button.on .bnic{background:radial-gradient(circle at 32% 26%,#ff9a6b,#e05a2b 58%,#7e2f12);box-shadow:0 6px 16px rgba(224,90,43,.5),inset 0 1px 3px rgba(255,255,255,.4);transform:translateY(-6px);color:#fff}
/* centre MATCHES tab: a big raised orb, the way the reference app does it */
.bnav button.ctr{flex:0 0 84px}
.bnorb{width:62px;height:62px;margin-top:-24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
 background:radial-gradient(circle at 34% 26%,#ff9a6b,#e05a2b 55%,#7e2f12);
 border:3px solid var(--card);box-shadow:0 10px 26px rgba(224,90,43,.55),0 0 0 2px rgba(255,192,46,.55),inset 0 2px 5px rgba(255,255,255,.45);transition:transform .2s,box-shadow .2s}
.bnorb svg{width:31px;height:31px}
.bnav button.ctr.on .bnorb{transform:translateY(-3px);box-shadow:0 14px 30px rgba(224,90,43,.7),0 0 0 3px var(--gold),inset 0 2px 6px rgba(255,255,255,.5)}
.bnav button.ctr:not(.on) .bnorb{filter:saturate(.55) brightness(.8)}
html[data-theme="light"] .bnorb{border-color:#fff}
html[data-theme="light"] .bnav{background:linear-gradient(180deg,#ffffff,#e8edf8);border-top-color:#c3cde2;box-shadow:0 -8px 22px rgba(20,30,70,.14)}

/* ---------- predictions ---------- */
.predcomp{font-family:'Alexandria','Cairo',sans-serif;font-weight:800;font-size:17px;color:var(--gold);text-align:center;padding:2px 0 10px;letter-spacing:.3px}
.predhero{background:linear-gradient(120deg,#2c1a40 0%,#7e2f12 130%);border:1px solid var(--acc);border-radius:16px;padding:14px 16px;margin-bottom:12px;position:relative;overflow:hidden}
.predhero::after{content:"⚽";position:absolute;inset-inline-end:-6px;bottom:-14px;font-size:64px;opacity:.14;transform:rotate(-15deg)}
.predhero .phl1{font-family:'Alexandria','Cairo',sans-serif;font-weight:800;font-size:16.5px;color:#fff8f2}
.predhero .phl2{font-size:12.5px;font-weight:700;color:var(--gold);padding-top:2px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;padding:16px 6px 14px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.pod{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;max-width:118px;min-width:0}

.pod.p1 .pava{width:66px;height:66px;font-size:27px;border-color:var(--gold);box-shadow:0 0 22px rgba(255,192,46,.4)}
.pod.p2 .pava{border-color:#b9c2d0}
.pod.p3 .pava{border-color:#c9803a}
.pod .pcrown{position:absolute;top:-19px;inset-inline:0;text-align:center;font-size:17px}
.pod .prank{font-size:10px;font-weight:900;color:var(--dim2)}
.pod .pname{font-size:12px;font-weight:800;color:var(--txt);text-shadow:none;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod.p1 .pname{font-size:13.5px;color:var(--gold)}
.pod .ppts{font-size:15px;font-weight:900;color:var(--gold)}
.pod .pclub{font-size:9.5px;color:var(--dim2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.authcard{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:16px;text-align:center;margin-bottom:12px}
.authcard .autxt{font-size:14px;font-weight:700;color:var(--dim);margin-bottom:10px}
.userchip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;margin-bottom:12px;font-size:14px}
.userchip .signout{margin-inline-start:auto;font-size:11.5px;color:var(--red);font-weight:700}
.userchip .uclub{font-size:11.5px;color:var(--gold);font-weight:700}
/* the recovery nudge: quieter than an error, louder than a footnote */
.shrow.mailrow{display:block}
.mailnudge{display:block;inline-size:100%;margin-block-end:12px;padding:10px 14px;text-align:start;
 border-radius:12px;border:1px dashed var(--gold);background:transparent;color:var(--gold);
 font:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
.pin{display:flex;align-items:center;gap:6px;justify-content:center}
.pinp{width:44px;height:38px;text-align:center;font-size:17px;font-weight:900;background:var(--card2);border:1px solid var(--line2);border-radius:9px;color:var(--txt);font-family:inherit}
.pdash{color:var(--dim2);font-weight:900}
.pentog{margin-top:4px;padding:3px 10px;border-radius:8px;background:none;border:1px dashed var(--line2);color:var(--dim);font-size:11px;font-weight:700}
.ppq{font-size:11.5px;font-weight:800;color:var(--gold)}
.ppr{display:flex;gap:6px;justify-content:center;margin:4px 0}
.ppw{padding:5px 10px;border-radius:9px;background:var(--card2);border:1px solid var(--line2);color:var(--txt);font-size:12px;font-weight:800;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppw.on{background:var(--accdark);border-color:var(--acc);color:#fff}
.pgo{margin-top:5px;padding:5px 18px;border-radius:9px;background:var(--accdark);border:1px solid var(--acc);color:#fff;font-size:12.5px;font-weight:800}
.mypick{font-size:18.5px;font-weight:900;color:var(--gold)}
.mypick.dimd{color:var(--dim2)}
.meRow{background:var(--card2)}
.prednote{font-size:12px;color:var(--dim2);font-weight:600;padding:2px 4px 10px}
#authModal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:120;display:flex;align-items:center;justify-content:center;padding:16px}
.autitle{font-size:17px;font-weight:900;padding-top:4px}
.authtabs{display:flex;gap:7px;margin:10px 0}
.authtabs button{flex:1;padding:9px 0;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--dim)}
.authtabs button.on{background:var(--accdark);border-color:var(--acc);color:#fff}
.auinp{width:100%;padding:11px 12px;margin:5px 0;background:var(--card2);border:1px solid var(--line2);border-radius:10px;color:var(--txt);font-family:inherit;font-size:15px;font-weight:700}
.auerr{color:var(--red);font-size:12.5px;font-weight:700;padding:6px 0}
.aubtn{width:100%;margin-top:8px}
.aunote{font-size:11.5px;color:var(--dim2);padding-top:8px;text-align:center}
.toast{position:fixed;bottom:84px;inset-inline:0;margin-inline:auto;width:fit-content;max-width:86%;background:rgba(8,10,20,.92);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:130;text-align:center}

/* ---------- LIVE NOW strip + club hero + details hint ---------- */
.livestrip{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.livestrip::-webkit-scrollbar{display:none}
.lvchip{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:#3a1220;border:1px solid var(--red);border-radius:12px;padding:8px 13px;font-size:12.5px;font-weight:800;color:#ffe9e9}
.lvchip .lvsc{color:#ff8f8f;font-weight:900;font-size:14px}
html[data-theme="light"] .lvchip{background:#ffe9e9;color:#7a1010}
html[data-theme="light"] .lvchip .lvsc{color:#c62828}
.dhint{color:var(--acc);font-weight:800}
.clubhero{display:block;background:linear-gradient(120deg,var(--card2),var(--card));border:1px solid var(--gold);border-radius:14px;padding:10px 14px;margin:0 0 10px;cursor:pointer;width:100%;text-align:start}
.clubhero .chcap{font-size:10.5px;color:var(--gold);font-weight:800;letter-spacing:.5px}
.clubhero .chtm{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0 2px;font-size:14.5px;font-weight:900}
.clubhero .chsub{text-align:center;font-size:11.5px;color:var(--dim);font-weight:700}
.setchip .han{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- chat ---------- */
.chatnote{text-align:center;font-size:12px;color:var(--dim2);font-weight:700;padding:2px 0 10px}
#chatLog{padding-bottom:180px}
.cmsg{background:var(--card);border:1px solid var(--line);border-radius:14px;border-start-start-radius:4px;padding:8px 12px 6px;margin:0 0 8px;max-width:86%;width:fit-content}
.cmsg.own{margin-inline-start:auto;background:var(--accdark);border-color:var(--acc);border-start-start-radius:14px;border-start-end-radius:4px}
.cmsg .cname{display:flex;align-items:center;gap:5px;min-width:0;font-size:10.5px;font-weight:800;color:var(--gold);letter-spacing:.3px}
.cmsg .cuser{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmsg .cclub{max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim);font-size:9.5px;font-weight:800;letter-spacing:0}
.cmsg.own .cname{color:#ffd9c7}
.cmsg.own .cclub{color:#f4cdbb}
.cmsg .ctxt{font-size:14.5px;font-weight:600;white-space:pre-wrap;word-break:break-word;color:var(--txt)}
.cmsg.own .ctxt{color:#fff}
.cmsg{position:relative}
.cdel{position:absolute;top:4px;inset-inline-end:6px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);color:#ffd6cc;opacity:.75}
.cdel svg{width:13px;height:13px}
.cdel:active{opacity:1;background:var(--red);color:#fff}
.cmsg.own .ctxt,.cmsg.own .cname{padding-inline-end:24px}
/* voice-note preview: play it, send it, or bin it — nothing uploads until Send */
.vnprev{position:absolute;bottom:100%;inset-inline:0;margin-bottom:8px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:8px 10px;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.vnprev .vnlab{font-size:11.5px;font-weight:800;color:var(--gold);white-space:nowrap}
.vnprev .vnaud{flex:1;min-width:0;height:32px}
.vnprev .vnx{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);font-size:14px}
.vnprev .vnsend{flex:0 0 auto;background:var(--accdark);border:1px solid var(--acc);color:#fff;font-weight:800;font-size:12.5px;border-radius:10px;padding:7px 14px}
.cmsg .ctime{font-size:9.5px;color:var(--dim2);text-align:end;padding-top:2px}
.cmsg.own .ctime{color:#f4cdbb}
.cmedia{display:block;max-width:min(74vw,300px);margin-top:4px;border-radius:10px;overflow:hidden;background:#090712}
.cmedia img,.cmedia video{display:block;width:100%;max-height:360px;object-fit:contain;background:#090712}
.cmedia audio{display:block;width:min(68vw,280px);height:42px}
.chatbar{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));inset-inline:10px;max-width:660px;margin-inline:auto;z-index:58;display:flex;gap:7px;align-items:flex-end;flex-wrap:wrap;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:8px 10px;box-shadow:0 8px 26px rgba(0,0,0,.35)}
.chattools{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.chattool{width:34px;height:40px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--txt);font-size:17px;line-height:1}
.chattool.recording{background:#7d1823;border-color:#ff6b77;color:#fff;animation:recpulse 1.1s infinite}
@keyframes recpulse{50%{box-shadow:0 0 0 4px rgba(255,75,90,.17)}}
.chatbar textarea{flex:1 1 130px;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-family:inherit;font-size:16px;font-weight:600;padding:8px 11px;resize:none;max-height:110px}
.chatbar #chatSend{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--accdark);border:1px solid var(--acc);color:#fff;font-size:16px}
[dir=rtl] .chatbar #chatSend{transform:scaleX(-1)}
.chatstatus{flex:0 0 100%;font-size:11px;font-weight:800;color:var(--gold);text-align:center;padding-top:1px}
.chatstate{display:inline-flex;align-items:center;gap:5px;margin-inline-start:7px}
.chatstate:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim2)}
.chatstate.online:before{background:#32c46f;box-shadow:0 0 7px rgba(50,196,111,.65)}
.chatstate.connecting:before{background:var(--gold)}
.navbadge{position:absolute;top:2px;inset-inline-end:12%;background:var(--red);color:#fff;font-size:9px;font-weight:900;border-radius:9px;padding:1px 5px;line-height:1.3}
.bnav button{position:relative}

/* ---------- install bar (WC-app style, sits above the bottom nav) ---------- */
.instbar{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom));inset-inline:10px;max-width:660px;margin-inline:auto;z-index:59;display:flex;align-items:center;gap:9px;background:linear-gradient(90deg,#2c1a40,#211235);border:1px solid var(--gold);border-radius:13px;padding:9px 12px;box-shadow:0 8px 26px rgba(0,0,0,.4)}
.instbar .ibico{flex:0 0 auto}
.instbar .ibtx{flex:1;min-width:0;font-size:12.5px;font-weight:700;color:#fff8f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.instbar .ibgo{flex:0 0 auto;background:var(--gold);color:#211235;font-weight:900;font-size:12.5px;border-radius:9px;padding:6px 16px}
.instbar .ibx{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff8f2;font-size:14px;line-height:1}

/* ---------- fantasy teaser ---------- */
.fantsoon{text-align:center;padding:90px 10px 40px}
.fantsoon .fbig{font-size:54px;line-height:1}
.fantsoon .fttl{font-family:'Alexandria','Cairo',system-ui,sans-serif;font-weight:800;font-size:22px;letter-spacing:1.5px;margin:14px 0 6px;color:var(--gold)}
.fantsoon .fsoon{font-size:16px;color:var(--dim);font-weight:700}
.fantcta{display:inline-block;margin-top:22px;padding:14px 30px;border-radius:14px;
 background:linear-gradient(180deg,#FF9563,#FF7A45 46%,#E45E2C);color:#0B1020;
 font-weight:900;font-size:16px;text-decoration:none;
 box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 14px -6px rgba(255,122,69,.55)}
.fantcta:active{transform:translateY(1px)}
.fantwho{margin-top:14px;font-size:11.5px;color:var(--dim2)}
@media(max-width:520px){
 .gkhead{gap:6px}
 .gklogo{width:40px;height:40px;flex-basis:40px}
 .gklogo img{width:31px;height:31px}
 .gktit{flex:0 0 auto}
 #setBtn{width:38px;height:38px;padding:7px;justify-content:center}
 #setLbl{display:none}
 #hdrAuth{max-width:78px;padding-inline:8px}
 #hdrAuth .han{max-width:48px}
 .themebtn{width:38px;height:38px;padding:7px;justify-content:center}
}
@media(max-width:370px){
 .gkname{font-size:20px}
 .gkmotto{font-size:12px}
 #hdrAuth{width:38px;padding:7px;justify-content:center}
 #hdrAuth .han{display:none}
}

/* ---------- keyboard focus ----------
   :focus-visible only, so a TAP never paints a ring but a keyboard/switch user always knows
   where they are. Two-tone ring so it survives on both the navy and the white grounds. */
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.bnav button:focus-visible,.chip:focus-visible,.lgchip:focus-visible{outline-offset:-3px}
.mx:focus-visible,.ibx:focus-visible{outline-offset:1px}

/* ---------- reduced motion ----------
   Honour the OS switch. Decoration stops dead; the SPINNER keeps turning (slowly) because it is
   the only signal that a fetch is still running - freezing it would read as a hung app. */
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{transition-duration:.01ms !important;scroll-behavior:auto !important}
 .lvdot{animation:none;opacity:1}
 .chattool.recording{animation:none}
 .spinner{animation-duration:1.8s}
}
/* the emoji panel sits above the composer, the reaction bar floats at the finger */
.emojipanel{position:fixed;z-index:120;display:flex;flex-wrap:wrap;gap:2px;padding:8px;
 max-block-size:44vh;overflow:auto;border-radius:14px;background:var(--card,#111a3a);
 border:1px solid var(--line,#243056);box-shadow:0 18px 40px -18px rgba(0,0,0,.7)}
.emojipanel button{font-size:22px;line-height:1;background:none;border:0;padding:6px;cursor:pointer;
 border-radius:8px}
.emojipanel button:active{transform:scale(.9);background:rgba(255,255,255,.08)}
.reactbar{position:fixed;z-index:130;display:flex;gap:2px;padding:6px 8px;border-radius:999px;
 background:var(--card,#111a3a);border:1px solid var(--line,#243056);
 box-shadow:0 14px 30px -14px rgba(0,0,0,.7)}
.reactbar button{font-size:22px;line-height:1;background:none;border:0;padding:4px 6px;cursor:pointer;
 border-radius:999px}
.reactbar button:active{transform:scale(.88)}
/* outside the bubble, vertically centred, and on the far side for your own messages — the
   near side already carries the delete control */
.cmsg .rxbtn{position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:-34px;
 inline-size:28px;block-size:28px;padding:0;background:var(--card);border:1px solid var(--line);
 border-radius:50%;color:var(--dim,#8fa0cc);cursor:pointer;display:flex;align-items:center;
 justify-content:center;opacity:.72}
.cmsg .rxbtn svg{inline-size:17px;block-size:17px;display:block}
.cmsg .rxbtn:hover,.cmsg .rxbtn:active{opacity:1;color:var(--acc,#FF7A45);border-color:var(--acc,#FF7A45)}
.cmsg.own .rxbtn{inset-inline-end:auto;inset-inline-start:-34px}
.rxrow{display:flex;flex-wrap:wrap;gap:4px;margin-block-start:6px}
.rxchip{display:inline-flex;align-items:center;gap:3px;font-size:12px;line-height:1;padding:3px 7px;
 border-radius:999px;border:1px solid var(--line,#243056);background:rgba(255,255,255,.05);
 color:var(--fg,#f2f5ff);cursor:pointer}
.rxchip span{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.rxchip.mine{border-color:var(--fx-gold,#e8b64c);background:color-mix(in srgb,var(--fx-gold,#e8b64c) 18%,transparent)}
.rxchip:active{transform:scale(.94)}
/* the lightbox sits above everything, including the reaction bar and the nav */
#lightbox{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.93);display:flex;
 align-items:center;justify-content:center;padding:16px}
#lightbox img{max-inline-size:100%;max-block-size:100%;object-fit:contain;border-radius:6px}
#lightbox .lbx{position:absolute;inset-block-start:calc(12px + env(safe-area-inset-top));
 inset-inline-end:14px;inline-size:44px;block-size:44px;border-radius:50%;background:rgba(0,0,0,.5);
 border:1px solid rgba(255,255,255,.28);color:#fff;font-size:26px;line-height:1;cursor:pointer;
 display:flex;align-items:center;justify-content:center}
#chatLog .cmedia img{cursor:zoom-in}
/* A REAL BUTTON, NOT A FLOATING GLYPH. It was absolute inside an unpositioned container, so it
   was drawn somewhere nobody would look for it, and it said nothing but "⤴". */
.mshare{display:flex;align-items:center;justify-content:center;gap:7px;inline-size:100%;
 margin-block:10px 2px;padding:11px 12px;border-radius:12px;
 border:1px solid var(--line);background:var(--card2,rgba(255,255,255,.06));
 color:var(--fg);font-weight:800;font-size:13.5px;cursor:pointer}
.mshare:active{transform:scale(.98)}
.mcd{display:inline-block;margin-block-start:4px;font-weight:800;color:var(--acc,#FF7A45)}
/* a text link, not a button that looks like the confirm button */
.aulink{display:block;inline-size:100%;margin-block-start:2px;padding:6px 2px;background:none;border:0;
 color:var(--acc,#FF7A45);font:inherit;font-size:12.5px;font-weight:800;text-align:center;cursor:pointer}
</style>

function clubArabic(tm, isNation){

 const short = tm.shortDisplayName || tm.displayName || tm.name || "?";

 if(isNation) return AR_NATIONS[k1] || AR_NATIONS[k2] || short;
 return AR_NATIONS[k2] || AR_TEAMS[k1] || AR_TEAMS[k2] || short;
}
function clubAr(tm){

 return LANG === "ar" ? clubArabic(tm) : (tm.shortDisplayName || tm.displayName || tm.name || "?");
}

/* ============ utils ============ */
function $(id){ return document.getElementById(id); }
/* 3D accent icon inside a text run — replaces emoji, which render differently on every platform
   (the same reason the country flags had to become images) */
function gki(name){ return '<svg class="gkic" aria-hidden="true"><use href="#gk3d-' + name + '"/></svg>'; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
let _dkf = null, _dkfTz = "";
function dkey(d){
 try{
  if(_dkfTz !== TZ){ _dkf = new Intl.DateTimeFormat("en-CA", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"}); _dkfTz = TZ; }
  return Number(_dkf.format(d).replace(/-/g, ""));
 }catch(_){ return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
}
function todayKey(){ return dkey(new Date()); }
/* A day key is a CALENDAR LABEL, so its arithmetic must not involve any timezone. Anchoring at
   12:00 UTC and stepping in UTC keeps it exact; the old local-midnight + dkey() round-trip lost a
   day whenever the chosen zone sat west of the device (QA: Dubai device + London zone). */
function keyToDate(k){ return new Date(Date.UTC(Math.floor(k / 10000), Math.floor(k / 100) % 100 - 1, k % 100, 12)); }
function addDaysKey(k, n){
 const d = keyToDate(k);
 d.setUTCDate(d.getUTCDate() + n);
 return d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate();
}
function rangeParam(k, before, after){ return addDaysKey(k, -(before)) + "-" + addDaysKey(k, after); }
/* WC v3.31: ESPN SILENTLY caps a scoreboard at 100 events when no limit is sent — a truncated
   response is indistinguishable from a real one. That bug hid an entire knockout round.
   Every scoreboard call in this app goes through here. Never build the URL by hand. */
/* `limit` IS the cap, and 300 had become too small for the combined feed. Measured on 23 Aug:
   no limit returns 100, `limit=300` returns exactly 300, `limit=1000` returns 333 - so 333 is
   the real answer for that day and 300 was silently losing 33 matches. The single-league feeds
   come nowhere near it; `all/` passes 300 most Saturdays, which is the discovery feed behind
   "Top Clubs - Other Competitions", so a cup tie past the three-hundredth match simply did not
   exist to the app. If a day ever returns exactly 1000 this is the line to raise again. */
function sbUrl(slug, range){ return API + slug + "/scoreboard?dates=" + range + "&limit=" + (slug === "all" ? 1000 : 300); }
/* European season runs Aug->May. Derived, never hardcoded, so it stays correct after every
   July rollover (standing rule 13: no baked-in dates). */
function curSeasonYear(){ const d = new Date(); return d.getUTCMonth() >= 6 ? d.getUTCFullYear() : d.getUTCFullYear() - 1; }
function seasonStartMs(){ return Date.UTC(curSeasonYear(), 7, 1); }
function seasonLabel(y){ return y + "-" + (y + 1); }
function locale(){ return LANG === "ar" ? "ar-EG-u-nu-latn" : "en-GB"; }
function fmtTime(iso){ try{ return new Intl.DateTimeFormat(locale(), {hour:"numeric", minute:"2-digit", hour12:H12, timeZone:TZ}).format(new Date(iso)); }catch(_){ try{ return new Intl.DateTimeFormat(locale(), {hour:"numeric", minute:"2-digit", hour12:H12}).format(new Date(iso)); }catch(__){ return ""; } } }
function fmtDayFull(k){ try{ return new Intl.DateTimeFormat(locale(), {weekday:"long", day:"numeric", month:"long"}).format(keyToDate(k)); }catch(_){ return String(k); } }
function evState(e){
 const s = (e.status && e.status.type && e.status.type.state) || (e.competitions && e.competitions[0] && e.competitions[0].status && e.competitions[0].status.type && e.competitions[0].status.type.state);
 return s || "pre";
}
function isHT(e){ const n = e.status && e.status.type && e.status.type.name; return n === "STATUS_HALFTIME"; }
function statusName(e){
 return (e.status && e.status.type && e.status.type.name) || (e.competitions && e.competitions[0] && e.competitions[0].status && e.competitions[0].status.type && e.competitions[0].status.type.name) || "";
}
function voidedKey(e){
 const n = statusName(e);
 if(n === "STATUS_POSTPONED" || n === "STATUS_SUSPENDED") return "postponed";
 if(n === "STATUS_CANCELED" || n === "STATUS_CANCELLED") return "canceled";
 /* ABANDONED comes through with state=post and a partial score, so it was rendering as an
    ordinary full-time result — and the worker fired a "full time" push for it. */
 if(n === "STATUS_ABANDONED") return "abandoned";
 return "";
}
/* left digit always belongs to the left-rendered team (home is on the RIGHT in RTL) */
function scoreTxt(H, A){
 const h = esc(H.score == null ? "0" : H.score), a = esc(A.score == null ? "0" : A.score);
 return LANG === "ar" ? a + " - " + h : h + " - " + a;
}
/* the two-legged tie: shown only when the aggregate actually differs from this leg, so a
   one-off match never grows a meaningless second scoreline */
function aggTxt(H, A){
 const hs = H.aggregateScore, as = A.aggregateScore;
 if(hs == null || as == null) return "";
 if(String(hs) === String(H.score) && String(as) === String(A.score)) return "";
 return LANG === "ar" ? as + " - " + hs : hs + " - " + as;
}
function shootTxt(H, A){
 const hs = H.shootoutScore, as = A.shootoutScore;
 if(hs == null || as == null) return "";
 return LANG === "ar" ? as + " - " + hs : hs + " - " + as;
}

/* ============ fetch layer (never blank UI; last-good kept) ============ */
async function jget(url){
 const ctl = new AbortController();
 const to = setTimeout(() => ctl.abort(), 12000);
 try{
  const r = await fetch(url, {cache:"no-store", signal:ctl.signal});
  if(!r.ok) throw new Error("http " + r.status);
  return await r.json();
 } finally { clearTimeout(to); }
}

/* PREDICTIONS, FANTASY AND CHAT NEED AN ACCOUNT. All three write something that belongs to a
   person - a prediction, a squad, a message - so a signed-out visitor has nowhere to put it
   and no name to appear under. Matches and Settings stay open, because reading scores should
   never ask anything of anybody.

   THIS IS A DOOR, NOT A LOCK, and it is worth being honest about which: the check reads
   localStorage in the page, so anybody who wants past it can get past it. It stops the app
   offering a screen that cannot work, and nothing more. Real protection belongs in the
   worker, which is where chat's own session token is already verified. */
const NEEDS_ACCOUNT = {pred: 1, fant: 1, chat: 1};
function requireAccount(v){
 if(!NEEDS_ACCOUNT[v]) return true;
 if(gkUser) return true;
 openAuth("L");
 return false;
}

/* ============ home: data ============ */
/* ESPN sometimes publishes the SAME fixture twice under two event ids with different kick-off times
   (seen on Liverpool v Como: a ghost 10:30Z entry with no venue alongside the real 17:00Z one at
   Anfield). Keep the better-sourced record: a real venue, then an in-play/finished status, then
   broadcast/odds detail — falling back to the first seen so the list stays stable. */
function fixtureKey(e){
 const cs = (e.competitions && e.competitions[0] && e.competitions[0].competitors) || [];
 const ids = cs.map(c => (c && c.team && c.team.id) || "").filter(Boolean).sort().join("-");
 return ids ? ids + "|" + dkey(new Date(e.date)) : null;
}
function fixtureScore(e){
 const c = (e.competitions && e.competitions[0]) || {};
 let s = 0;
 if(c.venue && c.venue.fullName) s += 4;
 const st = evState(e);
 if(st === "in" || st === "post") s += 3;
 if((c.broadcasts || []).length) s += 1;
 if((c.odds || []).length) s += 0.5;
 if((c.details || []).length) s += 1;
 return s;
}
function venueOf(e){ const c = (e.competitions && e.competitions[0]) || {}; return (c.venue && c.venue.fullName) || ""; }
/* Two entries for the same pair on the same day are the SAME fixture published twice unless both
   name a venue AND the venues differ AND they are hours apart — that pattern is a real double-header
   (e.g. a pre-season mini-tournament) and must not be collapsed. */
function sameFixture(a, b){
 const va = venueOf(a), vb = venueOf(b);
 if(va && vb && va !== vb && Math.abs(new Date(a.date) - new Date(b.date)) > 3 * 3600000) return false;
 return true;
}
function dedupeFixtures(list){
 const groups = {}, order = [];
 for(const e of list){
  const k = fixtureKey(e);
  if(!k){ order.push(e); continue; }
  const bucket = groups[k] || (groups[k] = []);
  const twin = bucket.find(x => sameFixture(x, e));
  if(!twin){ bucket.push(e); order.push(e); continue; }
  if(fixtureScore(e) > fixtureScore(twin)){
   bucket[bucket.indexOf(twin)] = e;
   order[order.indexOf(twin)] = e;   /* replace the weaker record in place; eventsFor re-sorts by date after */
  }
 }
 return order;
}
function eventsFor(lg, day){
 const c = dayCache[lg.id + "|" + day];
 if(!c) return null;
 const seen = {}; const out = [];
 for(const e of c.events){
  if(!e || !e.id || seen[e.id]) continue;
  seen[e.id] = 1;
  if(dkey(new Date(e.date)) === day) out.push(e);
 }
 const deduped = dedupeFixtures(out);
 deduped.sort((a, b) => new Date(a.date) - new Date(b.date));

}
async function fetchDayInto(day, force){
 const tk = todayKey();

 let anyFail = false;
 await Promise.all(LEAGUES.map(async lg => {
  const ck = lg.id + "|" + day;
  const c = dayCache[ck];
  const hasLive = c && c.events.some(e => evState(e) === "in");
  /* Active matches refresh on every 25-second lifecycle tick. Non-live schedules stay throttled. */
  const ttl = hasLive ? 22000 : nearToday ? 120000 : 600000;

  const slugs = [lg.slug].concat(lg.qual ? [lg.qual] : []);
  try{
   const results = await Promise.all(slugs.map(s => jget(sbUrl(s, rangeParam(day, 1, 1)))));
   const evs = [];
   /* SOLE writer of _gkLeagueId. Tagged at CACHE time, never at render time: the live strip,
      the LIVE list and the match sheet all read this field for events that were never drawn
      by mrow() (yesterday's still-running match). See LESSONS_AUDIT F-01. */
   results.forEach((j, si) => { (j && j.events || []).forEach(e => { if(si > 0) e._gkQual = 1; e._gkLeagueId = lg.id; evs.push(e); }); });
   dayCache[ck] = {at: Date.now(), events: evs};

}

  const ttl = hasLive ? 22000 : nearToday ? 120000 : 600000;
  if(!force && cached && Date.now() - cached.at < ttl) return;
  try{
   const j = await jget(sbUrl(source.slug, rangeParam(day, 1, 1)));
   let events = (j && Array.isArray(j.events) ? j.events : []).map(event => Object.assign({}, event, {

   }));
   if(source.slug === "club.friendly"){
    const trackedIds = await trackedClubIds();
    if(trackedIds && trackedIds.size) events = events.filter(event => {
     const competition = event && event.competitions && event.competitions[0];
     return !!(competition && Array.isArray(competition.competitors) && competition.competitors.some(item => item && item.team && trackedIds.has(String(item.team.id))));
    });

  }

/* ============ top clubs, in EVERY competition ============================================

   cup simply did not exist in this app. The owner's example, Wed 19 Aug 2026: Barcelona v Al Ahly
   — not in esp.1, and not under friendlies either, because ESPN files it as the Trofeo Joan Gamper
   (competition id 17929). Same for the Community Shield, the DFB-Pokal, the UEFA Super Cup, the
   Trophée des Champions, the Scottish League Cup and the Conference League qualifiers.

   THE FEED. ESPN publishes a cross-competition scoreboard at .../soccer/all/scoreboard?dates=…
   Measured 2026-08-17: 20260818 -> 43 events / 14 competitions, 20260819 -> 90 / 24 (Al Ahly at
   Barcelona among them), 20260821 -> 69 / 34. It carries NO competition name, only the l: value
   inside each uid (s:600~l:17929~e:401900551) — which is why top-clubs.js exists.

   THE 100-EVENT CAP IS REAL HERE TOO. all/scoreboard for 20260818-20260820 returns exactly 100

   WC v3.31. Every call below therefore goes through sbUrl(). Never build these URLs by hand.

   ROUTES DELIBERATELY NOT TAKEN. .../soccer/{slug}/teams/{id}/schedule returns 0 events for
   Barcelona, so per-team schedules are not a usable route and were not attempted. The 570 KB
   leagues/dropdown directory is read once offline and baked into top-clubs.js rather than fetched.

   WHY TWO TIERS. Discovery answers "which competitions matter on this date", which does not change
   minute to minute, so it is throttled hard. Live scores come from each discovered competition's
   OWN scoreboard, which is tiny (esp.1 over a 3-day range is 3.3 KB gzipped against 48 KB for one

   live rate instead would cost roughly 20 MB an hour on a phone. */
const TOPCLUB_GROUP_ID = "topclubs";

     what the app already did   32 requests    48 KB   (all nine leagues + every extra source)
     discovery, 3 dates          3 requests   299 KB   (38 + 145 + 116 KB for the 21st/22nd/23rd)
     the two cups it found       2 requests    14 KB   (ger.dfb_pokal 11 KB, ger.super_cup 2 KB)
   So ONE cold day-open costs about 7x what it used to. Steady state is far kinder, because the
   league fetches re-run every 25 s while a match is live and discovery does not: roughly 6.9 MB/h
   before, roughly +3.8 MB/h after on that same busy day. A quiet day is a third of it (19 Aug is
   48 KB for the whole date). Two TTLs keep it there. */
const TOP_DISCOVER_TTL = 600000;        /* today and its neighbours: new fixtures can still appear */
const TOP_DISCOVER_TTL_COLD = 3600000;  /* any other date: which competitions play on 3 Sept is settled */

const topCompCache = {};   // `${ESPN slug}|${dayKey}` -> {at, events[]}  the live-accurate copy
let _topIds = null, _coveredSlugs = null;
/* The club set comes from top-clubs.js (last season's FINAL standings). Missing or malformed file
   => empty set => the whole feature turns itself off and the app behaves exactly as before. */
function topClubIdSet(){
 if(_topIds) return _topIds;
 const ids = new Set();
 try{
  const lgs = (window.GK_TOP_CLUBS || {}).leagues || {};
  for(const k in lgs) for(const c of (lgs[k].top5 || [])) if(c && c.id) ids.add(String(c.id));

}
/* DERIVED, never a second hand-written list: add a league to LEAGUES or a slug to
   EXTRA_SCORE_SOURCES and it stops being treated as "extra" here automatically. This is the first
   of the two things that stop a fixture being counted twice. */
function coveredSlugSet(){
 if(_coveredSlugs) return _coveredSlugs;
 const s = new Set();
 for(const lg of LEAGUES){ if(lg.slug) s.add(lg.slug); if(lg.qual) s.add(lg.qual); }

}
function compIdOf(e){ const m = /~l:(\d+)~/.exec(String((e && e.uid) || "")); return m ? m[1] : ""; }
/* Generic round labels are NOT competition names. "regular-season" on a row would read as if the
   competition were called Regular Season, so those are rejected and the generic word is used. */
const GENERIC_SEASON_SLUG = /^(regular|post|pre) ?season$|^(group|knockout|league) stage$|^round of \d+$|^(quarter|semi)?finals?$|^playoffs?$|^playoff round$|^(clausura|apertura)$|^matchday/i;
function prettyCompName(e){
 const raw = String((e && e.season && e.season.slug) || "").replace(/^\d{4}(-\d{2,4})?-/, "").replace(/[-_]+/g, " ").trim();
 if(!raw || GENERIC_SEASON_SLUG.test(raw)) return "";

}
/* Returns {slug, en, ar}. `ar` is left EMPTY when no Arabic name exists — eventCompetitionName()
   already falls back en<-ar and ar<-en, so an English-only competition degrades gracefully instead
   of showing a transliteration nobody asked for. */
function compMetaOf(e, slugHint){
 let row = null;
 try{ row = (window.GK_COMPETITIONS || {})[compIdOf(e)] || null; }catch(_){}
 if(row) return {slug:row[0] || slugHint || "", en:row[1] || "", ar:row[2] || ""};

function hasTopClub(e, ids){
 const cs = (e && e.competitions && e.competitions[0] && e.competitions[0].competitors) || [];

}
function isTopClubExtra(e){
 const ids = topClubIdSet();

}
async function fetchTopClubsInto(day, force){
 if(!topClubIdSet().size) return false;
 let anyFail = false;
 /* Same +/-1 window every other fetch here uses, because dkey() is TIMEZONE-local: a 23:00Z kick-off
    is tomorrow in Dubai and yesterday in Los Angeles. Cached per SINGLE DATE rather than per range,
    so stepping to the next day in the strip reuses two of the three dates it already holds.
    Measured gzipped 2026-08-17: one date 48 KB; the same 3 days as one ranged call 127 KB — the
    ranged call is one request fewer but caches nothing and re-downloads on every step. */
 const dates = [addDaysKey(day, -1), day, addDaysKey(day, 1)];

  const c = topSbCache[d];
  /* the strip reaches +/-10 days; scrubbing it must not re-download a fixture list that cannot
     have changed, so only the live end of the calendar gets the short TTL */
  if(!force && c && Date.now() - c.at < (hot[d] ? TOP_DISCOVER_TTL : TOP_DISCOVER_TTL_COLD)) return;
  try{
   const j = await jget(sbUrl("all", String(d)));
   topSbCache[d] = {at:Date.now(), events:(j && Array.isArray(j.events) ? j.events : []).filter(isTopClubExtra)};
  }catch(_){ anyFail = true; /* keep this date's last-good list; never cache a negative */ }

    a cup score is as fresh as a league score. On a typical day this is 0-3 small requests. */

  const c = topCompCache[ck];
  const hasLive = c && c.events.some(e => evState(e) === "in");
  const ttl = hasLive ? 22000 : nearToday ? 120000 : 600000;
  if(!force && c && Date.now() - c.at < ttl) return;

   const j = await jget(sbUrl(slug, rangeParam(day, 1, 1)));
   const ids = topClubIdSet();
   topCompCache[ck] = {at:Date.now(), events:(j && Array.isArray(j.events) ? j.events : []).filter(e => hasTopClub(e, ids))};

}
/* MUST run AFTER fetchDayInto and fetchExtrasInto have settled for this day — the entire job here

function buildTopClubsBucket(day){

    NOT ENOUGH: ESPN publishes the same fixture under two event ids with different kick-off times
    (see the comment above dedupeFixtures; reproduced in the all/ feed on 2026-08-16, Como at
    Liverpool as a 10:30Z entry with no venue beside the real 17:00Z one at Anfield). An id check
    alone would let the twin through into a SECOND section, where dedupeFixtures — which only ever
    looks inside one group — could never catch it. */
 const ownedIds = {}, byFixture = {};
 for(const g of SCORE_GROUPS){
  if(g.id === TOPCLUB_GROUP_ID) continue;
  const c = dayCache[g.id + "|" + day];
  if(!c) continue;
  for(const e of c.events){
   if(!e || !e.id) continue;
   ownedIds[e.id] = 1;

  seen[e.id] = 1;
  /* Tagged at CACHE time, one writer, exactly like _gkLeagueId — the live strip, the LIVE list and
     the match sheet all read these fields for events mrow() never drew. See LESSONS_AUDIT F-01.
     Cloned rather than mutated so the shared discovery cache stays a clean copy of ESPN's reply
     and a later re-tag can never poison it. _gkCompetition also feeds slugForEvent(), which is how
     the match sheet knows to open .../{cup slug}/summary instead of a league slug. */
  out.push(Object.assign({}, e, {_gkLeagueId:TOPCLUB_GROUP_ID, _gkCompetition:compMetaOf(e, slugHint)}));

 /* Tier 2 first: where both tiers hold the same event, the competition's own feed is the fresher
    record and must win. Anything only discovery saw is then filled in behind it. */

  for(const e of (topCompCache[ck].events || [])) take(e, ck.slice(0, ck.length - suffix.length));

    no matches at all, an unknown group flips the empty state into the red "load failed" box. A
    silent group must therefore say "nothing here", not say nothing. */

let _dayInflight = null, _dayInflightDay = 0;
const _dayLoading = {};   /* dayKey -> true while a fetch for that day is in flight */
async function loadDay(force){
 const day = selDay;
 if(_dayInflight && _dayInflightDay === day && !force) return _dayInflight;
 const seq = ++dayLoadSeq;
 _dayLoading[day] = true;
 if(view === "home" && selDay === day && mainView === "scores") paintHome();   /* show the spinner the moment a date is tapped */
 const p = (async () => {
  let anyFail = true;
  try{
   /* A MATCH THAT KICKED OFF AT 23:30 IS STILL RUNNING AT 00:30 - on yesterday's card. The
      live set scans today AND yesterday, but only the selected day was ever FETCHED, so
      opening the app just after midnight showed tomorrow's fixtures and "zero live" until the
      user thought to tap the previous date themselves. Whenever today loads, yesterday loads
      with it; the TTLs make the extra call nearly free. */
   const alsoYd = day === todayKey() ? addDaysKey(day, -1) : null;
   const loaded = await Promise.all([fetchDayInto(day, force), fetchBroadcastInto(day, force), fetchExtrasInto(day, force), fetchTopClubsInto(day, force)]
     .concat(alsoYd ? [fetchDayInto(alsoYd, false), fetchBroadcastInto(alsoYd, false)] : []));
   /* loaded[3] is deliberately NOT folded into anyFail. If the cross-competition feed goes down the
      app must look EXACTLY as it did before this feature existed — and the stale bar is a visible
      change. The league list is what the warning is about; it is unaffected either way. */
   anyFail = loaded[0] || loaded[2];

   try{ buildTopClubsBucket(day); }catch(_){}

  }

/* LESSON (WC app v2.66): a match that kicked off before midnight is STILL LIVE after it. Gate the
   live set on state only — never on the calendar day — and span today + the previous day so a
   late kick-off never disappears at 00:00 while it is still being played. */

  for(const lg of SCORE_GROUPS){
   for(const e of (eventsFor(lg, day) || [])){
    if(!e || !e.id || seen[e.id]) continue;

    out.push(e);
   }
  }

}

/* ---------- sheet focus management ----------
   Sheets are visual overlays, but to a screen reader or a keyboard the page behind them is still
   fully reachable — Tab walks straight out of an open sheet into the match list underneath. One
   trap at the lowest common layer, driven by the SAME topmost-sheet order Escape uses, so a new
   sheet inherits it for free. */
const SHEET_IDS = ["modal", "tmfx", "promo", "playerCard", "authModal"];       /* base -> topmost */
function anySheetOpen(){
 return SHEET_IDS.some(id => { const el = $(id); return el && !el.classList.contains("hide"); });
}
function topSheet(){
 for(let i = SHEET_IDS.length - 1; i >= 0; i--){
  const el = $(SHEET_IDS[i]);
  if(el && !el.classList.contains("hide")) return el;
 }
 return null;
}
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function focusablesIn(el){
 return [...el.querySelectorAll(FOCUSABLE)].filter(n => n.offsetParent !== null || n === document.activeElement);
}
let _focusReturn = [];
function sheetOpened(el){
 if(!el) return;
 el.setAttribute("role", "dialog");
 el.setAttribute("aria-modal", "true");
 _focusReturn.push(document.activeElement);
 const f = focusablesIn(el);
 /* focus the panel itself, not the ✕ — landing on "close" reads as if the sheet is already ending */
 const panel = el.firstElementChild || el;
 if(!panel.hasAttribute("tabindex")) panel.setAttribute("tabindex", "-1");
 try{ (f.length ? panel : el).focus({preventScroll:true}); }catch(_){}
}
function sheetClosed(){
 const back = _focusReturn.pop();
 if(back && document.contains(back)){ try{ back.focus({preventScroll:true}); }catch(_){} }
}
document.addEventListener("keydown", function(ev){
 if(ev.key !== "Tab") return;
 const sheet = topSheet();
 if(!sheet) return;
 const f = focusablesIn(sheet);
 if(!f.length){ ev.preventDefault(); return; }
 const first = f[0], last = f[f.length - 1];
 if(!sheet.contains(document.activeElement)){ ev.preventDefault(); first.focus(); return; }
 if(ev.shiftKey && document.activeElement === first){ ev.preventDefault(); last.focus(); }
 else if(!ev.shiftKey && document.activeElement === last){ ev.preventDefault(); first.focus(); }
}, true);

/* HAPTICS. A tap on a phone should be felt as well as seen, and it is the cheapest possible
   confirmation that a control registered. Silently absent where the API is not supported,
   which is every desktop and every iPhone — Safari has never implemented it. */
function vib(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms || 12); }catch(_){} }

/* COUNTDOWN. Days, hours and minutes to kick-off. The Arabic side is not a translation of the
   English one: the units are written out, and each number-unit pair is wrapped so the sequence
   reads days -> hours -> minutes right-to-left instead of the browser reordering it. */
function countdown(ms){
 let sec = Math.max(0, Math.floor((ms - Date.now()) / 1000));
 const dd = Math.floor(sec / 86400); sec -= dd * 86400;
 const hh = Math.floor(sec / 3600); sec -= hh * 3600;
 const mm = Math.floor(sec / 60);
 if(LANG === "ar"){
  const dW = dd === 1 ? "يوم" : dd === 2 ? "يومان" : dd <= 10 ? "أيام" : "يوماً";
  return '<span dir="rtl">' + (dd ? "<bdi>" + dd + " " + dW + "</bdi> " : "")
   + "<bdi>" + hh + " س</bdi> <bdi>" + mm + " د</bdi></span>";
 }
 return '<span dir="ltr">' + (dd ? dd + "d " : "") + hh + "h " + mm + "m</span>";
}

/* TEXT AUTO-FIT. A long club name in a fixed box either clips or overflows; this shrinks the
   type until it fits, down to a floor so it never becomes unreadable. Costs a reflow per
   element, so it is scheduled once per frame rather than called per render. */
function fitText(el, min){
 if(!el) return;
 const floor = min || 8.5;
 let size = parseFloat(getComputedStyle(el).fontSize) || 12;
 let guard = 0;
 while(el.scrollWidth > el.clientWidth + 1 && size > floor && guard++ < 40){
  size -= 0.5;
  el.style.fontSize = size + "px";
 }
}
function fitNames(root){
 if(!root) return;
 try{ root.querySelectorAll(".mvt i, .tm i, .crn, .lbname, .cuser").forEach(function(e){ fitText(e, 8.5); }); }catch(_){}
}
let _fitT = 0;
function scheduleFit(){
 if(_fitT) return;
 _fitT = setTimeout(function(){ _fitT = 0; fitNames(document); }, 0);
}

/* ANALYTICS, AND DELIBERATELY NOT THE WC APP'S.
   That version generated a visitor id, looked the visitor up against a third-party geo
   service, and wrote the result into the world-readable textdb store. Two of those three are
   things this session has just spent hours removing: a geo lookup hands somebody's IP to a
   third party, and textdb is writable by anyone who knows the key.

   This counts what the owner actually asked for — how many people, how often — and nothing
   that identifies anybody: a day bucket, the app version, the language, and whether the app
   was launched installed or in a browser. No id, no IP lookup, no path, no referrer. One
   POST a day per device, to our own worker. */
function trackVisit(){
 try{
  if(navigator.webdriver) return;                        /* never count automation */
  if(location.hostname !== "goallak.com") return;         /* never count local or preview */
  const day = new Date().toISOString().slice(0, 10);
  if(localStorage.getItem("gk_seen_day") === day) return; /* once per device per day */
  localStorage.setItem("gk_seen_day", day);
  fetch(CHAT_API + "/api/visit", {
   method: "POST", cache: "no-store",
   headers: {"Content-Type": "application/json"},
   body: JSON.stringify({day: day, v: APP_VERSION, lang: LANG, standalone: isStandalone() ? 1 : 0})
  }).catch(function(){});
 }catch(_){}
}

/* ============ predictions: textdb storage (namespaced goalak_*, per-user pred keys) ============ */
const TDB_READ = "https://textdb.online/";
const TDB_WRITE = "https://api.textdb.online/update/";
/* Some ISP/router DNS setups cannot resolve textdb.online (found in QA). The push worker
   proxies the same store at /tdb, so storage works on those networks too. */
const TDB_PROXY = "https://goalak-push.ahmed-ayoty.workers.dev/tdb";
const CHAT_API = "https://goalak-push.ahmed-ayoty.workers.dev";
const ACCT_KEY = "goalak_accounts";
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function tdbRead(key, fallback){
 let txt = null;
 try{
  const r = await fetch(TDB_READ + key + "?t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error("http " + r.status);
  txt = (await r.text()).trim();
 }catch(_){
  const r2 = await fetch(TDB_PROXY + "/" + key + "?t=" + Date.now(), {cache:"no-store"});
  if(!r2.ok) throw new Error("proxy " + r2.status);
  txt = (await r2.text()).trim();
 }
 if(!txt) return fallback;
 try{ return JSON.parse(txt); }catch(_){ return fallback; }
}
async function tdbWrite(key, val){
 const body = "key=" + encodeURIComponent(key) + "&value=" + encodeURIComponent(JSON.stringify(val));
 const opts = {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body};
 try{
  const r = await fetch(TDB_WRITE, opts);
  if(!r.ok) throw new Error("write " + r.status);
 }catch(_){
  const r2 = await fetch(TDB_PROXY, opts);
  if(!r2.ok) throw new Error("proxy write " + r2.status);
 }
}
async function sha256(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join(""); }

async function createChatSession(username, password){
